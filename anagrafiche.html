  input, select { font-family:inherit; font-size:inherit; color:var(--ink); }

  .mono { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }

  .logo-lg { width:96px; height:67px; }
  .topbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1060px; margin:0 auto; padding:14px 18px 0; }
  .brand { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .brand h1 { font-size:21px; }
  .brand .sub { font-size:11.5px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; }
  .tabs { display:flex; gap:2px; margin-top:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { appearance:none; background:none; border:none; border-bottom:2px solid transparent; padding:8px 12px 10px; color:var(--ink-2); font-weight:500; white-space:nowrap; flex:none; }
  .tab[aria-selected="true"] { color:var(--accent-ink); border-bottom-color:var(--accent); }
  main { max-width:720px; margin:0 auto; padding:20px 16px 90px; }
  main.wide { max-width:1060px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--ink-2); }
  .small { font-size:13px; }
  .tiny { font-size:12px; }
  .eyebrow { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .sec-title { font-size:17px; }
  .divider { height:1px; background:var(--line); border:0; margin:0; }

  .btn { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:8px; font-weight:500; }
  .btn:hover { background:var(--surface-2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-quiet { border-color:transparent; background:var(--surface-2); }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .btn-xs { padding:4px 8px; font-size:12px; }

  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:600; letter-spacing:0.03em; color:var(--ink-2); text-transform:uppercase; }
  .inp { background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; width:100%; }
  .inp:focus { border-color:var(--accent); }

  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .pill-ok { background:var(--ok-soft); color:var(--ok); }
  .pill-warn { background:var(--warn-soft); color:var(--warn); }
  .pill-crit { background:var(--crit-soft); color:var(--crit); }
  .pill-idle { background:var(--surface-2); color:var(--ink-3); }
  .pill-live { background:var(--accent-soft); color:var(--accent-ink); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  @media (prefers-reduced-motion: no-preference) {
    .pill-live .dot { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .fade { animation:f .2s ease-out; } @keyframes f { from { opacity:0; transform:translateY(3px); } }
  }

  .dayhead { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; padding:16px 18px; flex-wrap:wrap; }
  .dayhead .d { font-family:var(--f-display); font-size:23px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; }
  .tile .k { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .tile .v { font-family:var(--f-mono); font-size:26px; font-weight:500; margin-top:5px; letter-spacing:-0.02em; }
  .tile .n { font-size:12px; color:var(--ink-2); margin-top:2px; }
  .tile.alert .v { color:var(--crit); }

  .ins { border-bottom:1px solid var(--line); padding:11px 16px; }
  .ins:last-child { border-bottom:0; }
  .ins-top { display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
  .ins-name { font-family:var(--f-display); font-size:17px; line-height:1.25; }
  .ins-tot { font-family:var(--f-mono); font-size:15px; font-variant-numeric:tabular-nums; text-align:right; flex:none; }
  .ins-tot .sec { font-size:11.5px; color:var(--ink-3); display:block; }
  .turni { margin-top:5px; display:flex; flex-wrap:wrap; gap:6px; }
  .turno { font-family:var(--f-mono); font-size:12px; background:var(--surface-2); color:var(--ink-2); padding:2px 7px; border-radius:5px; }
  .turno.aperto { background:var(--accent-soft); color:var(--accent-ink); }
  .turno.rotto { background:var(--crit-soft); color:var(--crit); }
  .confirm { margin-top:11px; background:var(--surface-2); border-radius:9px; padding:14px; }
  .bigtime { font-family:var(--f-mono); font-size:36px; font-weight:500; letter-spacing:0.02em; line-height:1.1; }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px; }
  .seg button { border:none; background:none; padding:6px 11px; border-radius:6px; color:var(--ink-2); font-weight:500; font-size:13.5px; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th { text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  tfoot td { font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0; }

  /* grafico ore */
  .chart { padding:4px 16px 16px; }
  .crow { display:grid; grid-template-columns:minmax(96px,1fr) 3fr auto; gap:10px; align-items:center; padding:5px 0; }
  .ctrack { position:relative; height:16px; }
  .cpres { position:absolute; inset:0 auto 0 0; height:16px; border-radius:4px; background:var(--data-weak); }
  .cnet { position:absolute; top:0; left:0; height:16px; border-radius:4px; background:var(--data); }
  .cname { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cval { font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .legend { display:flex; gap:16px; padding:2px 16px 10px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  details.day { border-bottom:1px solid var(--line); }
  details.day:last-child { border-bottom:0; }
  details.day > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  details.day > summary::-webkit-details-marker { display:none; }
  details.day > summary:hover { background:var(--surface-2); }
  .daydate { font-family:var(--f-display); font-size:16px; }

  .graf { padding:8px 16px 0; overflow-x:auto; }
  .graf svg { width:100%; min-width:520px; height:auto; display:block; }
  .gr-grid { stroke:var(--line); stroke-width:1; }
  .gr-zero { stroke:var(--line-strong); stroke-width:1.5; }
  .gr-lab { fill:var(--ink-3); font-size:10.5px; font-family:var(--f-mono); }
  .gr-line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .gr-dash { stroke-dasharray:5 4; }
  .gr-dot { stroke:var(--surface); stroke-width:1.5; }
  .gr-end { font-size:11px; font-family:var(--f-mono); font-weight:600; }
  polyline.gr-s0 { stroke:var(--data); fill:none; }
  circle.gr-s0 { fill:var(--data); }
  text.gr-s0 { fill:var(--data); stroke:none; }
  polyline.gr-s1 { stroke:var(--ink-3); fill:none; }
  circle.gr-s1 { fill:var(--ink-3); }
  text.gr-s1 { fill:var(--ink-3); stroke:none; }

  function traduci(e) {

  else document.addEventListener("DOMContentLoaded", parti);
})();

        corsi: r.corso ? [r.corso] : [], stato: r.ritirata ? "ritirata" : "attiva",
        dataUscita: r.ritirata ? (r.dataUscita || null) : null,
        motivo: r.ritirata ? (r.motivo || null) : null,
        iscrittaAlle: nowIso(), importata: true
      };
      if (stagioni().indexOf(r.stagione) < 0 && stagNuove.indexOf(r.stagione) < 0) stagNuove.push(r.stagione);
    });

    var passi = [];
    if (stagNuove.length) {
      var imp = JSON.parse(JSON.stringify(IMP()));
      stagNuove.forEach(function (x) { if (imp.stagioni.indexOf(x) < 0) imp.stagioni.push(x); });
      imp.stagioni.sort();
      passi.push(function () { return salvaImp(imp); });
    }
    if (Object.keys(nuoveAtlete).length) {
      passi.push(function () {
        var ref0 = ref("atlete");
        return ref0.update({ elenco: nuoveAtlete }).catch(function (e) {
          if (e && (e.code === "invalid_argument" || e.code === "transform_error")) {
            return ref0.get().then(function (sn) {
              return sn.exists ? ref0.update({ elenco: nuoveAtlete }) : ref0.set({ elenco: nuoveAtlete });
            });
          }
          throw e;
        });
      });
    }
    Object.keys(perStagione).forEach(function (st) {
      passi.push(function () { return scriviIscrizioni(st, perStagione[st]); });
    });

    var n = d.length;
    S.imp0 = { testo: "", nomeFile: "", righe: null, errori: [], caricando: true };
    render();
    passi.reduce(function (p, f) { return p.then(f); }, Promise.resolve())
      .then(function () {
        S.imp0.caricando = false;
        S.vista = "elenco";
        toast(n + " righe importate.", true);
      })
      .catch(function () { S.imp0.caricando = false; toast("Importazione non riuscita: nessun dato è stato modificato a metà."); });
  }

  // ---------------------------------------------------------- grafico a linee
  function graficoLinee(serie, etichette, opz) {
    opz = opz || {};
    var W = 760, H = opz.h || 230, PL = 52, PR = 74, PT = 14, PB = 26;
    var n = etichette.length;
    if (!n) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var valori = [];
    serie.forEach(function (s) { s.valori.forEach(function (v) { if (v != null) valori.push(v); }); });
    if (!valori.length) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var min = Math.min.apply(null, valori), max = Math.max.apply(null, valori);
    if (min > 0) min = 0;
    if (max < 0) max = 0;
    if (max === min) max = min + 1;
    var pad = (max - min) * 0.08;
    max += pad; min -= pad;
    function X(i) { return n === 1 ? PL : PL + (i * (W - PL - PR)) / (n - 1); }
    function Y(v) { return PT + ((max - v) * (H - PT - PB)) / (max - min); }

    var o = '<div class="graf"><svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + h(opz.titolo || "grafico") + '">';
    // griglia
    var passi = 4;
    for (var g = 0; g <= passi; g++) {
      var vv = min + ((max - min) * g) / passi, yy = Y(vv);
      o += '<line x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + yy.toFixed(1) + '" class="gr-grid"></line>';
      o += '<text x="' + (PL - 8) + '" y="' + (yy + 3.5).toFixed(1) + '" class="gr-lab" text-anchor="end">' + h(opz.fmtY ? opz.fmtY(vv) : Math.round(vv)) + "</text>";
    }
    if (min < 0 && max > 0) {
      o += '<line x1="' + PL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(0).toFixed(1) + '" class="gr-zero"></line>';
    }
    // etichette x
    var salto = n > 8 ? Math.ceil(n / 8) : 1;
    etichette.forEach(function (e, i) {
      if (i % salto && i !== n - 1) return;
      o += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" class="gr-lab" text-anchor="middle">' + h(e) + "</text>";
    });
    // serie
    serie.forEach(function (s, k) {
      var punti = [], ultimo = null, iUlt = -1;
      s.valori.forEach(function (v, i) {
        if (v == null) return;
        punti.push(X(i).toFixed(1) + "," + Y(v).toFixed(1));
        ultimo = v; iUlt = i;
      });
      if (!punti.length) return;
      o += '<polyline points="' + punti.join(" ") + '" class="gr-line gr-s' + k + (s.tratteggio ? " gr-dash" : "") + '"></polyline>';
      s.valori.forEach(function (v, i) {
        if (v == null) return;
        o += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="4" class="gr-dot gr-s' + k + '">' +
          "<title>" + h(s.nome + " · " + etichette[i] + " · " + (opz.fmtY ? opz.fmtY(v) : v)) + "</title></circle>";
      });
      if (iUlt >= 0) {
        o += '<text x="' + (W - PR + 8) + '" y="' + (Y(ultimo) + 4).toFixed(1) + '" class="gr-end gr-s' + k + '">' +
          h(opz.fmtY ? opz.fmtY(ultimo) : ultimo) + "</text>";
      }
    });
    o += "</svg></div>";
    // legenda
    if (serie.length > 1) {
      o += '<div class="legend">' + serie.map(function (s, k) {
        return '<span><i class="gr-key gr-s' + k + (s.tratteggio ? " gr-dash" : "") + '"></i>' + h(s.nome) + "</span>";
      }).join("") + "</div>";
    }
    return o;
  }

  // ---------------------------------------------------------- barre divergenti
  function barreDivergenti(righe, opz) {
    opz = opz || {};
    if (!righe.length) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var maxAss = righe.reduce(function (m, r) { return Math.max(m, Math.abs(r.valore)); }, 0) || 1;
    var o = '<div class="chart">';
    righe.forEach(function (r) {
      var perc = (Math.abs(r.valore) / maxAss) * 50;
      var pos = r.valore >= 0;
      o += '<div class="crow"><div class="cname">' + h(r.nome) + "</div>" +
        '<div class="dtrack">' +
        '<div class="dzero"></div>' +
        '<div class="dbar ' + (pos ? "dpos" : "dneg") + '" style="' +
        (pos ? "left:50%; width:" + perc.toFixed(1) + "%" : "right:50%; width:" + perc.toFixed(1) + "%") + '"></div></div>' +
        '<div class="cval" style="color:' + (pos ? "var(--ok)" : "var(--crit)") + '">' + h(opz.fmt ? opz.fmt(r.valore) : r.valore) + "</div></div>";
    });
    o += "</div>";
    return o;
  }

      ids.forEach(function (id) {

      settoriPresenti().forEach(function (set) {

        });

      Object.keys(perCorso).sort().forEach(function (c) {

      o += '<div class="tablewrap"><table><thead><tr><th>Atleta</th><th class="num">Anno</th><th class="num">Età</th><th>Stato</th><th>Uscita</th><th></th></tr></thead><tbody>';

            '<td class="num"><button class="btn btn-xs" data-act="' + (rit ? "riattiva" : "ritira") + '" data-v="' + h(id) + '">' + (rit ? "Riattiva" : "Segna ritiro") + "</button>" +

  // ------------------------------------------------------------ ANAGRAFE
  var CAMPI_ATLETA = [

    { k: "email", l: "Email", w: 260, tipo: "email" },
    { k: "telefono", l: "Telefono", w: 175 },

  function annoDi(a) {
    if (a && a.dataNascita && /^\d{4}-/.test(a.dataNascita)) return +a.dataNascita.slice(0, 4);
    return a && a.anno ? +a.anno : null;
  }
  function certificatoStato(a) {
    if (!a || !a.scadenzaCertificato) return { c: "idle", t: "Certificato non registrato" };
    var oggi = todayKey();
    if (a.scadenzaCertificato < oggi) return { c: "crit", t: "Certificato scaduto" };
    var fra30 = addGiorni(oggi, 30);
    if (a.scadenzaCertificato <= fra30) return { c: "warn", t: "Scade entro 30 giorni" };
    return { c: "ok", t: "Certificato valido" };
  }
  function addGiorni(k, n) {
    var p2 = k.split("-"), d = new Date(+p2[0], +p2[1] - 1, +p2[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function vistaAnagrafe() {
    var el = elenco(), st = stagAttiva(), righe = iscrittiDi(st);
    var filtro = S.cerca.trim().toLowerCase();
    var ids = Object.keys(el).filter(function (id) { return !filtro || nomeAtleta(id).toLowerCase().indexOf(filtro) >= 0; });
    ids.sort(function (a, b) { return nomeAtleta(a).localeCompare(nomeAtleta(b), "it"); });

    var scaduti = 0, inScadenza = 0, senza = 0;

      var c = certificatoStato(el[id]);

    });

    var o = '<div class="tiles">' +
      tile("Atlete in archivio", String(Object.keys(el).length), "di tutte le stagioni", false) +
      tile("Certificati scaduti", String(scaduti), "non possono allenarsi", scaduti > 0) +
      tile("In scadenza", String(inScadenza), "entro trenta giorni", inScadenza > 0) +
      tile("Senza certificato", String(senza), "da registrare", senza > 0) +
      "</div>";

    o += '<div class="card"><div class="row" style="padding:14px 16px; justify-content:space-between">' +
      '<div><div class="eyebrow">Archivio</div><h2 class="sec-title">Scheda di ogni atleta</h2>' +
      '<div class="small muted">I dati che non cambiano da una stagione all\'altra.</div></div></div>' +
      '<div style="padding:0 16px 12px"><input class="inp" data-act="cerca" placeholder="Cerca un nome" value="' + h(S.cerca) + '" autocomplete="off"></div>';

    if (!ids.length) {
      o += '<div class="empty">' + (filtro ? "Nessun nome corrisponde." : "Nessuna atleta in archivio.") + "</div></div>";
      return o;
    }

    o += '<div class="tablewrap"><table><thead><tr><th>Atleta</th><th class="num">Nascita</th><th>Corsi in ' + h(st) + '</th><th>Certificato</th><th></th></tr></thead><tbody>';
    ids.forEach(function (id) {
      var a = el[id], cs = corsiDi(righe[id]), cert = certificatoStato(a);
      o += "<tr><td><b>" + h(nomeAtleta(id)) + "</b>" +
        (a.email ? '<div class="tiny muted">' + h(a.email) + "</div>" : "") + "</td>" +
        '<td class="num muted">' + h(a.dataNascita ? a.dataNascita.split("-").reverse().join("/") : (a.anno || "—")) + "</td>" +
        '<td class="small">' + (cs.length ? h(cs.join(", ")) : '<span class="muted">non iscritta</span>') + "</td>" +
        '<td><span class="pill pill-' + cert.c + '"><span class="dot"></span>' + h(cert.t) + "</span>" +
        (a.scadenzaCertificato ? '<div class="tiny muted mono">' + h(a.scadenzaCertificato.split("-").reverse().join("/")) + (a.tipoCertificato ? " · " + h(a.tipoCertificato) : "") + "</div>" : "") + "</td>" +
        '<td class="num"><button class="btn btn-xs" data-act="apriScheda" data-v="' + h(id) + '">Apri la scheda</button></td></tr>';

    });
    o += "</tbody></table></div></div>";
    return o;

  function schedaAtleta(id) {

  // ------------------------------------------------------------ INSEGNANTI
  var GIORNI_SET = ["", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato", "domenica"];
  var CAMPI_INS = [
    { k: "cognome", l: "Cognome", w: 200 },
    { k: "nome", l: "Nome", w: 180 },
    { k: "cf", l: "Codice fiscale", w: 200, mono: true },
    { k: "dataNascita", l: "Data di nascita", w: 170, tipo: "date" },
    { k: "luogoNascita", l: "Luogo di nascita", w: 210 },
    { k: "indirizzo", l: "Indirizzo", w: 300 },
    { k: "email", l: "Email", w: 250, tipo: "email" },
    { k: "telefono", l: "Telefono", w: 170 },
    { k: "iban", l: "IBAN", w: 300, mono: true },
    { k: "scadenzaTesseramento", l: "Scadenza tesseramento", w: 190, tipo: "date" }
  ];

  function insList() {
    var e = S.insegnanti || {};
    return Object.keys(e).map(function (id) {
      var x = e[id] || {};
      return {
        id: id, cognome: x.cognome || "", nome: x.nome || "", cf: x.cf || "",
        dataNascita: x.dataNascita || "", luogoNascita: x.luogoNascita || "",
        indirizzo: x.indirizzo || "", email: x.email || "", telefono: x.telefono || "",
        iban: x.iban || "", scadenzaTesseramento: x.scadenzaTesseramento || "",
        tipoCompenso: x.tipoCompenso || "orario", compenso: x.compenso == null ? "" : x.compenso,
        attiva: x.attiva === false ? false : true, note: x.note || "",
        orario: (x.orario || []).map(function (r) {
          return { corso: r.corso || "", giorno: +r.giorno || 1, inizio: r.inizio || "", fine: r.fine || "" };
        })
      };
    }).sort(function (a, b) {
      return (a.cognome + " " + a.nome).localeCompare(b.cognome + " " + b.nome, "it");
    });
  }
  function nomeIns(i) { return (i.cognome + " " + i.nome).trim() || "senza nome"; }
  function minutiTurnoIns(r) {
    var a = toMinuti(r.inizio), b = toMinuti(r.fine);
    return a == null || b == null || b <= a ? 0 : b - a;
  }
  function toMinuti(t) {
    if (!/^\d{1,2}:\d{2}$/.test(String(t || "").trim())) return null;
    var q = String(t).split(":");
    return +q[0] * 60 + +q[1];
  }
  function oreSettIns(i) {
    var m = 0;
    (i.orario || []).forEach(function (r) { m += minutiTurnoIns(r); });
    return m / 60;
  }
  function orePerCorsoIns(i) {
    var out = {};
    (i.orario || []).forEach(function (r) {
      if (!r.corso) return;
      out[r.corso] = (out[r.corso] || 0) + minutiTurnoIns(r) / 60;
    });
    return out;
  }
  function costoStagioneIns(i) {
    var imp = num(i.compenso);
    if (!imp) return 0;
    if (i.tipoCompenso === "mensile") return imp * num(IMP().mesiCompenso || 10);
    return imp * oreSettIns(i) * num(IMP().settimane || 0);
  }
  function tesseramentoStato(i) {
    if (!i.scadenzaTesseramento) return { c: "idle", t: "Non registrato" };
    if (i.scadenzaTesseramento < todayKey()) return { c: "crit", t: "Scaduto" };
    if (i.scadenzaTesseramento <= addGiorni(todayKey(), 30)) return { c: "warn", t: "In scadenza" };
    return { c: "ok", t: "Valido" };
  }

  function scriviInsegnante(id, dati) {
    return scriviNested("insegnanti", "elenco", id, dati);
  }

  function vistaInsegnanti() {
    var lista = insList(), attive = lista.filter(function (i) { return i.attiva; });
    var filtro = S.cercaIns.trim().toLowerCase();
    var mostrate = lista.filter(function (i) { return !filtro || nomeIns(i).toLowerCase().indexOf(filtro) >= 0; });

    var oreTot = 0, costoTot = 0, senzaOrario = 0, tessProblemi = 0;
    attive.forEach(function (i) {
      oreTot += oreSettIns(i);
      costoTot += costoStagioneIns(i);
      if (!oreSettIns(i)) senzaOrario += 1;
      var ts = tesseramentoStato(i);
      if (ts.c === "crit" || ts.c === "warn") tessProblemi += 1;
    });

    var o = '<div class="tiles">' +
      tile("Insegnanti attive", String(attive.length), "su " + lista.length + " in archivio", false) +
      tile("Ore alla settimana", fmtNum(Math.round(oreTot * 100) / 100), "somma degli orari", false) +
      tile("Costo di stagione", eur(costoTot), "stima da compensi e orari", false) +
      tile("Tesseramenti da guardare", String(tessProblemi), "scaduti o in scadenza", tessProblemi > 0) +
      "</div>";

    if (senzaOrario) o += '<div class="banner banner-warn">Ci sono ' + senzaOrario + " insegnanti attive senza orario: finché l'orario manca, le loro ore non entrano nel conto e i costi per corso restano incompleti.</div>";

    o += '<div class="card"><div class="row" style="padding:14px 16px; justify-content:space-between">' +
      '<div><div class="eyebrow">Archivio</div><h2 class="sec-title">Insegnanti</h2>' +
      '<div class="small muted">Dati, compenso concordato e orario settimanale diviso per corso.</div></div>' +
      '<div class="row"><button class="btn btn-sm" data-act="csvIns">Scarica CSV</button>' +
      '<button class="btn btn-sm btn-primary" data-act="nuovaIns">+ Nuova insegnante</button></div></div>' +
      '<div style="padding:0 16px 12px"><input class="inp" data-act="cercaIns" placeholder="Cerca un nome" value="' + h(S.cercaIns) + '" autocomplete="off"></div>';

    if (!mostrate.length) {
      o += '<div class="empty">' + (filtro ? "Nessun nome corrisponde." : "Nessuna insegnante in archivio.") + "</div></div>";
      return o + riepilogoOreCorso(lista);
    }

    o += '<div class="tablewrap"><table><thead><tr><th>Insegnante</th><th>Compenso</th><th class="num">Ore/sett</th><th>Corsi allenati</th><th>Tesseramento</th><th></th></tr></thead><tbody>';
    mostrate.forEach(function (i) {
      var ts = tesseramentoStato(i), perCorso = orePerCorsoIns(i);
      var corsi = Object.keys(perCorso);
      o += "<tr" + (i.attiva ? "" : ' style="opacity:.55"') + "><td><b>" + h(nomeIns(i)) + "</b>" +
        (i.attiva ? "" : ' <span class="pill pill-idle">non attiva</span>') +
        (i.email ? '<div class="tiny muted">' + h(i.email) + "</div>" : "") + "</td>" +
        "<td>" + (num(i.compenso)
          ? '<b class="mono">' + eur(i.compenso) + "</b>" + '<div class="tiny muted">' + (i.tipoCompenso === "mensile" ? "al mese" : "all\'ora") + "</div>"
          : '<span class="muted">non indicato</span>') + "</td>" +
        '<td class="num">' + fmtNum(Math.round(oreSettIns(i) * 100) / 100) + "</td>" +
        '<td class="small">' + (corsi.length ? h(corsi.join(", ")) : '<span class="muted">orario da compilare</span>') + "</td>" +
        '<td><span class="pill pill-' + ts.c + '"><span class="dot"></span>' + h(ts.t) + "</span></td>" +
        '<td class="num"><button class="btn btn-xs" data-act="apriIns" data-v="' + h(i.id) + '">' + (S.insOpen === i.id ? "Chiudi" : "Apri la scheda") + "</button></td></tr>";
      if (S.insOpen === i.id) o += '<tr><td colspan="6" style="padding:0">' + schedaInsegnante(i) + "</td></tr>";
    });
    o += "</tbody></table></div></div>";
    o += riepilogoOreCorso(lista);
    return o;
  }

  function riepilogoOreCorso(lista) {
    var perCorso = {};
    lista.forEach(function (i) {
      if (!i.attiva) return;
      var m = orePerCorsoIns(i);
      Object.keys(m).forEach(function (c) { perCorso[c] = (perCorso[c] || 0) + m[c]; });
    });
    var chiavi = Object.keys(perCorso);
    if (!chiavi.length) return "";
    var ordine = nomiCorsi();
    chiavi.sort(function (a, b) {
      var ia = ordine.indexOf(a), ib = ordine.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    var max = chiavi.reduce(function (m, k) { return Math.max(m, perCorso[k]); }, 0) || 1;
    var o = '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Riepilogo</div>' +
      '<h2 class="sec-title">Ore di insegnamento per corso</h2>' +
      '<p class="small muted" style="margin:3px 0 6px">Somma degli orari di tutte le insegnanti attive. È la base per attribuire il costo del personale a ciascun corso.</p></div><div class="chart">';
    chiavi.forEach(function (k) {

  function leggiInsegnante(i) {

    d.tipoCompenso = i.tipoCompenso; d.compenso = i.compenso; d.attiva = i.attiva; d.note = i.note;
    Array.prototype.forEach.call(document.querySelectorAll("[data-ins]"), function (e) {
      var k = e.dataset.ins;

    });
    var base = (S.insDraft && S.insDraft.id === i.id && S.insDraft.orario) ? S.insDraft.orario : i.orario;
    d.orario = base.map(function (r) { return { corso: r.corso, giorno: r.giorno, inizio: r.inizio, fine: r.fine }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-orario]"), function (e) {
      var k = +e.dataset.orario;
      if (!d.orario[k]) d.orario[k] = { corso: "", giorno: 1, inizio: "", fine: "" };
      var f = e.dataset.f;

  function csvInsegnanti() {
    var out = [["Cognome", "Nome", "Codice fiscale", "Data di nascita", "Luogo di nascita", "Indirizzo", "Email", "Telefono", "IBAN", "Scadenza tesseramento", "Tipo compenso", "Importo", "Ore settimanali", "Costo stagione stimato", "In servizio", "Corso", "Giorno", "Inizio", "Fine"]];
    insList().forEach(function (i) {
      var base = [i.cognome, i.nome, i.cf, i.dataNascita, i.luogoNascita, i.indirizzo, i.email, i.telefono, i.iban,
        i.scadenzaTesseramento, i.tipoCompenso === "mensile" ? "mensile" : "orario", fmtNum(i.compenso),
        fmtNum(Math.round(oreSettIns(i) * 100) / 100), eur(costoStagioneIns(i)), i.attiva ? "sì" : "no"];
      if (!i.orario.length) out.push(base.concat(["", "", "", ""]));
      else i.orario.forEach(function (r) {

    return out.map(function (r) {

  // ------------------------------------------------------------ PAGAMENTI
  function curvaPagamenti(st) {
    var righe = iscrittiDi(st), mesi = {}, voci = [], pagati = [];
    Object.keys(righe).forEach(function (id) {
      var r = righe[id];
      vociDi(r).forEach(function (v) {
        voci.push({ scadenza: v.scadenza, atteso: v.atteso });
        if (v.scadenza) mesi[v.scadenza.slice(0, 7)] = true;
        var sv = statoVoce(r, v);
        if (sv.stato === "pagata" && sv.pg && sv.pg.data) {
          pagati.push({ data: sv.pg.data, importo: sv.importo });
          mesi[sv.pg.data.slice(0, 7)] = true;
        }
      });
    });
    var chiavi = Object.keys(mesi).sort();
    if (!chiavi.length) return null;
    // riempio i mesi mancanti fra il primo e l'ultimo
    var pieni = [], a = +chiavi[0].slice(0, 4), m = +chiavi[0].slice(5, 7);
    var fine = chiavi[chiavi.length - 1], guardia = 0;
    while (guardia++ < 24) {
      var k = a + "-" + pad(m);
      pieni.push(k);
      if (k === fine) break;
      m += 1; if (m > 12) { m = 1; a += 1; }
    }
    var serieAtteso = [], serieInc = [], ca = 0, ci = 0;
    pieni.forEach(function (k, i) {
      voci.forEach(function (v) {
        var quando = v.scadenza || pieni[0];
        if (quando.slice(0, 7) === k) ca += v.atteso;
      });
      pagati.forEach(function (pg) { if (pg.data.slice(0, 7) === k) ci += pg.importo; });
      serieAtteso.push(ca);
      serieInc.push(ci);
    });
    return { mesi: pieni, atteso: serieAtteso, incassato: serieInc };
  }

  function vistaPagamenti(st) {
    if (!st) return '<div class="card"><div class="empty">Nessuna stagione aperta.</div></div>';

      if (q.nScaduti) nScad += 1;
      q.voci.forEach(function (v) {
        var sv = statoVoce(righe[id], v);

    });

    var o = '<div class="tiles">' +
      tile("Dovuto", eur(totDov), "nella stagione " + st, false) +
      tile("Incassato", eur(totInc), totDov ? Math.round((totInc / totDov) * 100) + "% del dovuto" : "", false) +
      tile("Da incassare", eur(Math.max(0, totDov - totInc)), "ancora aperto", false) +
      tile("Scaduto", eur(totScad), nScad + (nScad === 1 ? " famiglia in ritardo" : " famiglie in ritardo"), totScad > 0) +
      "</div>";

    if (!rate().length) o += '<div class="banner banner-warn">Non ci sono rate impostate: aprile in Impostazioni, altrimenti qui non compare nessuna scadenza.</div>';

    var cur = curvaPagamenti(st);
    if (cur) {
      o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Ritmo degli incassi</div>' +
        '<h2 class="sec-title">Incassato rispetto all\'atteso</h2>' +
        '<p class="small muted" style="margin:3px 0 6px">La linea tratteggiata è quanto avreste dovuto incassare alle scadenze, quella piena è quanto è entrato per davvero. La distanza fra le due è l\'arretrato che si sta accumulando.</p></div>' +
        graficoLinee([
          { nome: "Incassato", valori: cur.incassato },
          { nome: "Atteso alle scadenze", tratteggio: true, valori: cur.atteso }
        ], cur.mesi.map(function (k) { return MESI[+k.slice(5, 7) - 1].slice(0, 3) + " " + k.slice(2, 4); }),
          { titolo: "incassato rispetto all'atteso", fmtY: function (v) { return eur(v); } }) +
        "</div>";
    }

    o += '<div class="card" style="padding:12px 15px"><div class="row">' +
      ["tutte", "arretrati", "saldate"].map(function (f) {
        var et = f === "tutte" ? "Tutte" : f === "arretrati" ? "Con arretrati" : "Saldate";
        return '<button class="btn btn-sm' + (S.filtroPag === f ? " btn-primary" : "") + '" data-act="filtroPag" data-v="' + f + '">' + et + "</button>";
      }).join("") + "</div></div>";

    o += '<div class="card"><div style="padding:14px 16px 4px"><div class="eyebrow">Stagione ' + h(st) + "</div>" +
      '<h2 class="sec-title">Registro pagamenti</h2>' +
      '<p class="small muted" style="margin:3px 0 0">Gli importi nascono dalla retta dei corsi divisa nelle rate, più le quote di iscrizione e saggio. Lo sconto si imposta sulla scheda della bambina.</p></div>';

    var mostrate = 0;
    o += '<div class="tablewrap"><table><thead><tr><th>Atleta</th><th class="num">Dovuto</th><th class="num">Incassato</th><th class="num">Residuo</th><th>Rate</th><th></th></tr></thead><tbody>';
    ids.forEach(function (id) {
      var r = righe[id], q = quadroDi(r);
      if (S.filtroPag === "arretrati" && !q.nScaduti) return;
      if (S.filtroPag === "saldate" && q.residuo > 0.01) return;
      mostrate += 1;
      var cs = corsiDi(r);
      o += "<tr><td><b>" + h(nomeAtleta(id)) + "</b>" +
        '<div class="tiny muted">' + h(cs.join(", ") || "nessun corso") + (num(r.sconto) ? " · sconto " + eur(r.sconto) : "") + "</div></td>" +
        '<td class="num">' + eur(q.dovuto) + "</td>" +
        '<td class="num" style="color:var(--ok)">' + eur(q.incassato) + "</td>" +
        '<td class="num"' + (q.residuo > 0.01 ? ' style="font-weight:600"' : "") + ">" + eur(q.residuo) + "</td>" +
        "<td><div class=\"row\" style=\"gap:5px\">";
      q.voci.forEach(function (v) {
        var sv = statoVoce(r, v);
        var cls = sv.stato === "pagata" ? "pill-ok" : sv.stato === "scaduta" ? "pill-crit" : "pill-idle";
        var et = v.chiave === "iscrizione" ? "Iscrizione" : v.chiave === "saggio" ? "Saggio" : v.etichetta;
        o += '<span class="pill ' + cls + '" title="' + h(v.etichetta) + '"><span class="dot"></span>' + h(et) + "</span>";
      });
      o += "</div></td>" +
        '<td class="num"><button class="btn btn-xs" data-act="apriPag" data-v="' + h(id) + '">' + (S.pagOpen === id ? "Chiudi" : "Dettaglio") + "</button></td></tr>";
      if (S.pagOpen === id) o += '<tr><td colspan="6" style="padding:0">' + dettaglioPagamenti(id, r, q) + "</td></tr>";
    });
    o += "</tbody></table></div>";

    o += "</div>";

    var mesi = Object.keys(perMese).sort();
    o += '<div class="card"><div style="padding:14px 16px 4px"><div class="eyebrow">Riepilogo</div>' +

      o += '<div class="empty">Nessun incasso registrato.</div></div>';

      o += '<div class="crow"><div class="cname">' + h(MESI[me - 1] + " " + an) + "</div>" +
        '<div class="ctrack"><div class="cnet" style="width:' + Math.round((perMese[k] / maxM) * 100) + '%"></div></div>' +
        '<div class="cval">' + eur(perMese[k]) + "</div></div>";
    });
    o += "</div>" +
      '<div class="row" style="padding:12px 16px; border-top:1px solid var(--line); justify-content:space-between">' +
      '<b>Totale incassato nella stagione</b><b class="mono">' + eur(totInc) + "</b></div></div>";
    return o;
  }

  function vistaPerdite(st) {
    function blocco(chiave, spiega) {
      var g = raggruppa(st, chiave), chiavi = Object.keys(g.gruppi);
      if (chiave === "fascia") {
        var ord = FASCE.map(nomeFascia);
        chiavi.sort(function (a, b) { return ord.indexOf(a) - ord.indexOf(b); });
      } else if (chiave === "settore") {
        chiavi.sort(function (a, b) {
          var ia = SETTORI.indexOf(a), ib = SETTORI.indexOf(b);
          return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        });
      } else chiavi.sort();
      var o = '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Chi non si riscrive</div>' +
        '<h2 class="sec-title">' + (chiave === "fascia" ? "Per fascia d\'età" : chiave === "settore" ? "Per settore" : "Per corso") + "</h2>" +
        '<p class="small muted" style="margin:3px 0 8px">' + h(spiega) + "</p></div>";
      if (!chiavi.length) return o + '<div class="empty">Nessun dato per questa stagione.</div></div>';
      var max = chiavi.reduce(function (m, k) { return Math.max(m, g.gruppi[k].tot); }, 0) || 1;
      o += '<div class="tablewrap"><table><thead><tr><th>' + (chiave === "fascia" ? "Fascia" : chiave === "settore" ? "Settore" : "Corso") +
        '</th><th class="num">Iscritte</th><th></th><th class="num">Riconfermate</th><th class="num">Tasso di conferma</th></tr></thead><tbody>';
      chiavi.forEach(function (k) {
        var x = g.gruppi[k], t = g.haSucc && x.tot ? x.ric / x.tot : null;
        var col = t == null ? "var(--ink-2)" : (t < 0.6 ? "var(--crit)" : t < 0.8 ? "var(--warn)" : "var(--ok)");
        o += "<tr><td><b>" + h(k) + "</b></td>" +
          '<td class="num">' + x.tot + "</td>" +
          '<td><div class="barbg"><div class="bar" style="width:' + Math.round((x.tot / max) * 100) + '%"></div></div></td>' +
          '<td class="num muted">' + (g.haSucc ? x.ric : "—") + "</td>" +
          '<td class="num" style="color:' + col + '"><b>' + (t == null ? '<span class="muted">n.d.</span>' : Math.round(t * 100) + "%") + "</b></td></tr>";
      });
      return o + "</tbody></table></div></div>";
    }
    var o = "";
    if (!st) return '<div class="card"><div class="empty">Nessuna stagione.</div></div>';
    if (!vicina(st, 1)) o += '<div class="banner banner-warn">Per la stagione ' + h(st) + " non esiste ancora quella successiva, quindi il tasso di conferma non è calcolabile. Scegli in alto una stagione precedente, oppure apri la nuova stagione da Impostazioni.</div>";
    o += blocco("fascia", "Quante ce n'erano in ogni fascia e quante di quelle si sono riscritte l'anno dopo. È la riga con il tasso più basso che dice dove intervenire.");
    o += blocco("settore", "Lo stesso taglio per settore, che è la lettura più utile quando si decide dove investire.");
    o += blocco("corso", "E qui corso per corso, per capire quale singolo gruppo trattiene e quale no.");
    return o;
  }

    stagioni().forEach(function (st) {

      var pr = prec ? iscrittiDi(prec) : null, su = succ ? iscrittiDi(succ) : null;
      Object.keys(righe).forEach(function (id) {
        var a = elenco()[id] || {}, r = righe[id], eta = etaIn(st, a.anno);
        var cs = corsiDi(r);
        var sett = [];

        out.push([st, a.cognome || "", a.nome || "", a.anno || "", eta == null ? "" : eta, fasciaDi(eta),
          sett.join(" / "), cs.join(" / "), r.stato === "ritirata" ? "ritirata" : "attiva", r.dataUscita || "", r.motivo || "",

        fr.readAsArrayBuffer(file);
      }).catch(function () {
        S.imp0.errori = ["Non sono riuscito a caricare il lettore dei file Excel. Salva il foglio come CSV, oppure copia le celle e incollale qui sotto."];
        S.imp0.righe = null; render();
      });
      return;
    }
    var fr2 = new FileReader();
    fr2.onload = function (e) {
      var res = analizzaTesto(e.target.result);
      S.imp0.testo = String(e.target.result).slice(0, 4000);
      S.imp0.righe = res.righe.length ? res.righe : null;
      S.imp0.errori = res.errori;
      render();
    };
    fr2.readAsText(file, "utf-8");
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.dataset && ev.target.dataset.act === "cercaIns") {
      S.cercaIns = ev.target.value;
      var pos2 = ev.target.selectionStart;
      render();
      var n2 = document.querySelector('[data-act="cercaIns"]');
      if (n2) { n2.focus(); try { n2.setSelectionRange(pos2, pos2); } catch (e) {} }
      return;
    }
    if (ev.target.dataset && ev.target.dataset.act === "cerca") {
      S.cerca = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var n = document.querySelector('[data-act="cerca"]');
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });

  function attach() {
    S.db.collection("anagrafica").limit(80).onSnapshot(function (snap) {
      var isc = {};
      snap.docs.forEach(function (d) {
        var b = d.data() || {};
        if (d.id === "atlete") S.atlete = { elenco: b.elenco || {} };
        else if (d.id === "insegnanti") S.insegnanti = b.elenco || {};
        else if (d.id === "impostazioni") { if (b.stagioni && b.stagioni.length) S.imp = b; }
        else if (d.id.indexOf("isc-") === 0) isc[String(b.stagione || d.id.slice(4).replace("-", "/"))] = { righe: b.righe || {} };
      });
      S.iscrizioni = isc;
      render();
    }, function () { S.err = "L'anagrafica non si sta aggiornando. Ricarica la pagina."; render(); });
  }

  function boot() {
    window.ZODIACO_PRONTO = function () { S.sbloccato = true; render(); };
    render();
    if (!(window.claude && typeof window.claude.use === "function")) {
      S.err = "Questa anteprima non è collegata all'archivio: le modifiche non vengono salvate."; render(); return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) { S.err = "Archivio non disponibile in questa vista."; render(); return; }
      S.db = db; attach();
    }).catch(function () { S.err = "Archivio non raggiungibile."; render(); });
    window.claude.use("downloads").then(function (d) { S.downloads = d; }).catch(function () {});
  }
  boot();
})();
</script>

</html>
