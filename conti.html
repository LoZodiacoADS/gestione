  .logo-lg { width:96px; height:67px; }
  .topbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1060px; margin:0 auto; padding:14px 18px 0; }
  .brand { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .brand h1 { font-size:21px; }
  .brand .sub { font-size:11.5px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; }
  .tabs { display:flex; gap:2px; margin-top:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { appearance:none; background:none; border:none; border-bottom:2px solid transparent; padding:8px 12px 10px; color:var(--ink-2); font-weight:500; white-space:nowrap; flex:none; }
  .tab[aria-selected="true"] { color:var(--accent-ink); border-bottom-color:var(--accent); }
  main { max-width:720px; margin:0 auto; padding:20px 16px 90px; }
  main.wide { max-width:1060px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--ink-2); }
  .small { font-size:13px; }
  .tiny { font-size:12px; }
  .eyebrow { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .sec-title { font-size:17px; }
  .divider { height:1px; background:var(--line); border:0; margin:0; }

  .btn { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:8px; font-weight:500; }
  .btn:hover { background:var(--surface-2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-quiet { border-color:transparent; background:var(--surface-2); }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .btn-xs { padding:4px 8px; font-size:12px; }

  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:600; letter-spacing:0.03em; color:var(--ink-2); text-transform:uppercase; }
  .inp { background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; width:100%; }
  .inp:focus { border-color:var(--accent); }

  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .pill-ok { background:var(--ok-soft); color:var(--ok); }
  .pill-warn { background:var(--warn-soft); color:var(--warn); }
  .pill-crit { background:var(--crit-soft); color:var(--crit); }
  .pill-idle { background:var(--surface-2); color:var(--ink-3); }
  .pill-live { background:var(--accent-soft); color:var(--accent-ink); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  @media (prefers-reduced-motion: no-preference) {
    .pill-live .dot { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .fade { animation:f .2s ease-out; } @keyframes f { from { opacity:0; transform:translateY(3px); } }
  }

  .dayhead { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; padding:16px 18px; flex-wrap:wrap; }
  .dayhead .d { font-family:var(--f-display); font-size:23px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; }
  .tile .k { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .tile .v { font-family:var(--f-mono); font-size:26px; font-weight:500; margin-top:5px; letter-spacing:-0.02em; }
  .tile .n { font-size:12px; color:var(--ink-2); margin-top:2px; }
  .tile.alert .v { color:var(--crit); }

  .ins { border-bottom:1px solid var(--line); padding:11px 16px; }
  .ins:last-child { border-bottom:0; }
  .ins-top { display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
  .ins-name { font-family:var(--f-display); font-size:17px; line-height:1.25; }
  .ins-tot { font-family:var(--f-mono); font-size:15px; font-variant-numeric:tabular-nums; text-align:right; flex:none; }
  .ins-tot .sec { font-size:11.5px; color:var(--ink-3); display:block; }
  .turni { margin-top:5px; display:flex; flex-wrap:wrap; gap:6px; }
  .turno { font-family:var(--f-mono); font-size:12px; background:var(--surface-2); color:var(--ink-2); padding:2px 7px; border-radius:5px; }
  .turno.aperto { background:var(--accent-soft); color:var(--accent-ink); }
  .turno.rotto { background:var(--crit-soft); color:var(--crit); }
  .confirm { margin-top:11px; background:var(--surface-2); border-radius:9px; padding:14px; }
  .bigtime { font-family:var(--f-mono); font-size:36px; font-weight:500; letter-spacing:0.02em; line-height:1.1; }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px; }
  .seg button { border:none; background:none; padding:6px 11px; border-radius:6px; color:var(--ink-2); font-weight:500; font-size:13.5px; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th { text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  tfoot td { font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0; }

  /* grafico ore */
  .chart { padding:4px 16px 16px; }
  .crow { display:grid; grid-template-columns:minmax(96px,1fr) 3fr auto; gap:10px; align-items:center; padding:5px 0; }
  .ctrack { position:relative; height:16px; }
  .cpres { position:absolute; inset:0 auto 0 0; height:16px; border-radius:4px; background:var(--data-weak); }
  .cnet { position:absolute; top:0; left:0; height:16px; border-radius:4px; background:var(--data); }
  .cname { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cval { font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .legend { display:flex; gap:16px; padding:2px 16px 10px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  details.day { border-bottom:1px solid var(--line); }
  details.day:last-child { border-bottom:0; }
  details.day > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  details.day > summary::-webkit-details-marker { display:none; }
  details.day > summary:hover { background:var(--surface-2); }
  .daydate { font-family:var(--f-display); font-size:16px; }

  .graf { padding:8px 16px 0; overflow-x:auto; }
  .graf svg { width:100%; min-width:520px; height:auto; display:block; }
  .gr-grid { stroke:var(--line); stroke-width:1; }
  .gr-zero { stroke:var(--line-strong); stroke-width:1.5; }
  .gr-lab { fill:var(--ink-3); font-size:10.5px; font-family:var(--f-mono); }
  .gr-line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .gr-dash { stroke-dasharray:5 4; }
  .gr-dot { stroke:var(--surface); stroke-width:1.5; }
  .gr-end { font-size:11px; font-family:var(--f-mono); font-weight:600; }
  polyline.gr-s0 { stroke:var(--data); fill:none; }
  circle.gr-s0 { fill:var(--data); }
  text.gr-s0 { fill:var(--data); stroke:none; }
  polyline.gr-s1 { stroke:var(--ink-3); fill:none; }
  circle.gr-s1 { fill:var(--ink-3); }
  text.gr-s1 { fill:var(--ink-3); stroke:none; }

    var l = palestre();
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i].nome;
    return "";
  }
  function corsi() { return CFG().corsi || []; }
  function settoreDi(nome) {
    var l = corsi();
    for (var i = 0; i < l.length; i++) if (l[i].nome === nome) return l[i].settore || "Senza settore";
    return "Senza settore";
  }
  function oreCorso(c) {
    var t = 0;
    Object.keys(c.ore || {}).forEach(function (k) { t += num(c.ore[k]); });
    return t;
  }
  function oreTotali() { return corsi().reduce(function (t, c) { return t + oreCorso(c); }, 0); }
  function oreInPalestra(pid) { return corsi().reduce(function (t, c) { return t + num((c.ore || {})[pid]); }, 0); }

  // --------------------------------------------------------- periodo
  function modoPeriodo() { return CFG().periodo === "anno" ? "anno" : "stagione"; }
  function meseInizio() { var m = +CFG().meseInizio; return m >= 1 && m <= 12 ? m : 9; }
  function rangeCorrente(ancora) {
    var a = +(ancora || S.anno);
    if (modoPeriodo() === "anno") return { da: a + "-01-01", a: a + "-12-31" };
    var m = meseInizio();
    var fineA = m === 1 ? a : a + 1, fineM = m === 1 ? 12 : m - 1;
    var ultimo = new Date(fineA, fineM, 0).getDate();
    return { da: a + "-" + pad(m) + "-01", a: fineA + "-" + pad(fineM) + "-" + pad(ultimo) };
  }
  function etichettaPeriodo(ancora) {
    var a = +(ancora || S.anno);
    if (modoPeriodo() === "anno") return String(a);
    return a + "/" + pad((a + 1) % 100);
  }
  function mesiDelPeriodo(ancora) {
    var r = rangeCorrente(ancora), out = [];
    var a = +r.da.slice(0, 4), m = +r.da.slice(5, 7);
    for (var i = 0; i < 12; i++) {
      out.push(a + "-" + pad(m));
      m += 1; if (m > 12) { m = 1; a += 1; }
    }
    return out;
  }
  function periodiDisponibili() {
    var set = {}, oggi = new Date();
    var base = modoPeriodo() === "anno" ? oggi.getFullYear()
      : (oggi.getMonth() + 1 >= meseInizio() ? oggi.getFullYear() : oggi.getFullYear() - 1);
    set[base] = true; set[base - 1] = true; set[base + 1] = true;
    tutteLeRighe().forEach(function (r) {
      if (!r.data) return;
      var a = +r.data.slice(0, 4), m = +r.data.slice(5, 7);
      if (modoPeriodo() === "anno") set[a] = true;
      else set[m >= meseInizio() ? a : a - 1] = true;
    });
    return Object.keys(set).map(Number).sort(function (x, y) { return x - y; }).map(String);
  }

  // --------------------------------------------------------- movimenti
  function righeAnno(anno) { return (S.anni[anno] && S.anni[anno].righe) || {}; }
  function tutteLeRighe() {
    var out = [];
    Object.keys(S.anni).forEach(function (a) {
      var r = righeAnno(a);
      Object.keys(r).forEach(function (id) {
        var x = r[id];
        if (!x || x.rimossa) return;
        out.push(normalizza(id, a, x));
      });
    });
    return out;
  }
  function normalizza(id, anno, x) {
    return {
      id: id, anno: anno, tipo: x.tipo || "uscita", data: x.data || "", voce: x.voce || "",
      descrizione: x.descrizione || "", controparte: x.controparte || "", palestra: x.palestra || "",
      importo: num(x.importo), scadenza: x.scadenza || "",
      centroTipo: x.centroTipo || "comune", centroValore: x.centroValore || "",
      pagamenti: (x.pagamenti || []).map(function (p) {
        return { data: p.data || "", importo: num(p.importo), modalita: p.modalita || "" };
      }),
      note: x.note || ""
    };
  }
  function pagatoDi(r) { return r.pagamenti.reduce(function (t, p) { return t + p.importo; }, 0); }
  function residuoDi(r) { return Math.max(0, r.importo - pagatoDi(r)); }
  function statoDi(r) {
    var res = residuoDi(r);
    if (res <= 0.009) return { c: "ok", t: "Saldato" };
    if (pagatoDi(r) > 0) return { c: "warn", t: "Parziale" };
    if (r.scadenza && r.scadenza < todayKey()) return { c: "crit", t: "Scaduto" };
    return { c: "idle", t: "Da pagare" };
  }
  function righeDellAnno() {
    var r = rangeCorrente();
    return tutteLeRighe().filter(function (x) { return x.data && x.data >= r.da && x.data <= r.a; });
  }

  function scriviRiga(anno, id, riga) {
    if (!S.db) return Promise.reject({ code: "unavailable" });
    var ref = S.db.doc("movimenti/a" + anno), body = {}, inner = {};
    inner[id] = riga; body.righe = inner;
    return ref.update(body).catch(function (e) {
      if (e && (e.code === "invalid_argument" || e.code === "transform_error")) {
        return ref.acquire({ holder: "m" + Math.random().toString(36).slice(2), ttlMs: 4000 })
          .catch(function () { return {}; })
          .then(function () { return ref.get(); })
          .then(function (sn) {
            if (sn.exists) return ref.update(body);
            return ref.set({ anno: anno, creatoAlle: nowIso(), righe: inner });
          });
      }
      throw e;
    });
  }
  function salvaCfg(next) {
    S.cfg = next;
    if (!S.db) { render(); return Promise.resolve(); }
    return S.db.doc("config/setup").set(next).catch(function () { toast("Non è stato possibile salvare."); });
  }
  function toast(msg, ok) {
    S.toast = msg; S.toastOk = !!ok; render();
    setTimeout(function () { if (S.toast === msg) { S.toast = ""; S.toastOk = false; render(); } }, 4600);
  }
  function tile(k, v, n, alert) {
    return '<div class="tile' + (alert ? " alert" : "") + '"><div class="k">' + h(k) + '</div><div class="v">' + h(v) + '</div><div class="n">' + h(n) + "</div></div>";
  }

  // --------------------------------------------------------- render
  // ---------------------------------------------------------- grafico a linee
  function graficoLinee(serie, etichette, opz) {
    opz = opz || {};
    var W = 760, H = opz.h || 230, PL = 52, PR = 74, PT = 14, PB = 26;
    var n = etichette.length;
    if (!n) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var valori = [];
    serie.forEach(function (s) { s.valori.forEach(function (v) { if (v != null) valori.push(v); }); });
    if (!valori.length) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var min = Math.min.apply(null, valori), max = Math.max.apply(null, valori);
    if (min > 0) min = 0;
    if (max < 0) max = 0;
    if (max === min) max = min + 1;
    var pad = (max - min) * 0.08;
    max += pad; min -= pad;
    function X(i) { return n === 1 ? PL : PL + (i * (W - PL - PR)) / (n - 1); }
    function Y(v) { return PT + ((max - v) * (H - PT - PB)) / (max - min); }

    var o = '<div class="graf"><svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + h(opz.titolo || "grafico") + '">';
    // griglia
    var passi = 4;
    for (var g = 0; g <= passi; g++) {
      var vv = min + ((max - min) * g) / passi, yy = Y(vv);
      o += '<line x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + yy.toFixed(1) + '" class="gr-grid"></line>';
      o += '<text x="' + (PL - 8) + '" y="' + (yy + 3.5).toFixed(1) + '" class="gr-lab" text-anchor="end">' + h(opz.fmtY ? opz.fmtY(vv) : Math.round(vv)) + "</text>";
    }
    if (min < 0 && max > 0) {
      o += '<line x1="' + PL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + Y(0).toFixed(1) + '" class="gr-zero"></line>';
    }
    // etichette x
    var salto = n > 8 ? Math.ceil(n / 8) : 1;
    etichette.forEach(function (e, i) {
      if (i % salto && i !== n - 1) return;
      o += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" class="gr-lab" text-anchor="middle">' + h(e) + "</text>";
    });
    // serie
    serie.forEach(function (s, k) {
      var punti = [], ultimo = null, iUlt = -1;
      s.valori.forEach(function (v, i) {
        if (v == null) return;
        punti.push(X(i).toFixed(1) + "," + Y(v).toFixed(1));
        ultimo = v; iUlt = i;
      });
      if (!punti.length) return;
      o += '<polyline points="' + punti.join(" ") + '" class="gr-line gr-s' + k + (s.tratteggio ? " gr-dash" : "") + '"></polyline>';
      s.valori.forEach(function (v, i) {
        if (v == null) return;
        o += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="4" class="gr-dot gr-s' + k + '">' +
          "<title>" + h(s.nome + " · " + etichette[i] + " · " + (opz.fmtY ? opz.fmtY(v) : v)) + "</title></circle>";
      });
      if (iUlt >= 0) {
        o += '<text x="' + (W - PR + 8) + '" y="' + (Y(ultimo) + 4).toFixed(1) + '" class="gr-end gr-s' + k + '">' +
          h(opz.fmtY ? opz.fmtY(ultimo) : ultimo) + "</text>";
      }
    });
    o += "</svg></div>";
    // legenda
    if (serie.length > 1) {
      o += '<div class="legend">' + serie.map(function (s, k) {
        return '<span><i class="gr-key gr-s' + k + (s.tratteggio ? " gr-dash" : "") + '"></i>' + h(s.nome) + "</span>";
      }).join("") + "</div>";
    }
    return o;
  }

  // ---------------------------------------------------------- barre divergenti
  function barreDivergenti(righe, opz) {
    opz = opz || {};
    if (!righe.length) return '<div class="empty">Non ci sono ancora dati da mostrare.</div>';
    var maxAss = righe.reduce(function (m, r) { return Math.max(m, Math.abs(r.valore)); }, 0) || 1;
    var o = '<div class="chart">';
    righe.forEach(function (r) {
      var perc = (Math.abs(r.valore) / maxAss) * 50;
      var pos = r.valore >= 0;
      o += '<div class="crow"><div class="cname">' + h(r.nome) + "</div>" +
        '<div class="dtrack">' +
        '<div class="dzero"></div>' +
        '<div class="dbar ' + (pos ? "dpos" : "dneg") + '" style="' +
        (pos ? "left:50%; width:" + perc.toFixed(1) + "%" : "right:50%; width:" + perc.toFixed(1) + "%") + '"></div></div>' +
        '<div class="cval" style="color:' + (pos ? "var(--ok)" : "var(--crit)") + '">' + h(opz.fmt ? opz.fmt(r.valore) : r.valore) + "</div></div>";
    });
    o += "</div>";
    return o;
  }

  function render() {
    var app = document.getElementById("app");
    var o = "";
    if (S.toast) o += '<div class="banner banner-' + (S.toastOk ? "ok" : "warn") + '" style="margin-bottom:14px">' + h(S.toast) + "</div>";
    if (S.err) o += '<div class="banner banner-warn" style="margin-bottom:14px">' + h(S.err) + "</div>";
    if (!S.sbloccato) o += gate();
    else {
      o += '<div class="stack">' + barraAnno();
      if (S.vista === "uscite" || S.vista === "entrate") o += vistaMovimenti(S.vista === "uscite" ? "uscita" : "entrata");
      else if (S.vista === "centri") o += vistaCentri();
      else if (S.vista === "andamento") o += vistaAndamento();
      else o += vistaImp();
      o += "</div>";
    }
    try { app.innerHTML = o; }
    catch (e) { while (app.firstChild) app.removeChild(app.firstChild); app.innerHTML = o; }
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", b.dataset.v === S.vista ? "true" : "false");
    });
    var f = app.querySelector("[data-autofocus]"); if (f) f.focus();
  }

  function gate() {
    return '<div class="card" style="max-width:420px; margin:40px auto; padding:26px">' +
      '<div class="eyebrow">Accesso riservato</div>' +
      "<h2 class=\"sec-title\" style=\"margin:4px 0 6px\">I conti dell'associazione</h2>" +
      '<p class="small muted" style="margin-top:0">Entrate, uscite e costi per corso. Accesso a chi gestisce.</p>' +
      '<p class="small muted">Riservato all\'amministrazione.</p></div>';
  }

  function barraAnno() {
    return '<div class="card" style="padding:12px 15px"><div class="row" style="justify-content:space-between">' +
      '<div class="row"><span class="eyebrow">' + (modoPeriodo() === "anno" ? "Anno" : "Stagione") + '</span>' +
      '<select class="inp" style="max-width:140px" data-act="anno">' +
      periodiDisponibili().map(function (a) { return '<option value="' + a + '"' + (a === S.anno ? " selected" : "") + ">" + h(etichettaPeriodo(a)) + "</option>"; }).join("") +
      "</select>" +
      '<span class="tiny muted mono">' + h(dataIt(rangeCorrente().da)) + " → " + h(dataIt(rangeCorrente().a)) + "</span></div>" +
      '<button class="btn btn-sm" data-act="csv">Scarica CSV</button></div></div>';
  }

  // --------------------------------------------------------- movimenti
  function vociDi(tipo) { return tipo === "uscita" ? (CFG().vociUscita || []) : (CFG().vociEntrata || []); }

  function vistaMovimenti(tipo) {
    var righe = righeDellAnno().filter(function (r) { return r.tipo === tipo; });
    var tot = 0, pagato = 0, scaduto = 0, nScaduti = 0;
    righe.forEach(function (r) {
      tot += r.importo; pagato += pagatoDi(r);
      var st = statoDi(r);
      if (st.c === "crit") { scaduto += residuoDi(r); nScaduti += 1; }
    });
    var etichetta = tipo === "uscita" ? "Uscite" : "Entrate";

    var o = '<div class="tiles">' +
      tile(etichetta + " " + etichettaPeriodo(), eur(tot), "totale registrato", false) +
      tile(tipo === "uscita" ? "Pagato" : "Incassato", eur(pagato), tot ? Math.round((pagato / tot) * 100) + "% del totale" : "", false) +
      tile(tipo === "uscita" ? "Da pagare" : "Da incassare", eur(Math.max(0, tot - pagato)), "ancora aperto", false) +
      tile("Scaduto", eur(scaduto), nScaduti + (nScaduti === 1 ? " voce" : " voci"), scaduto > 0) +
      "</div>";

    // filtri
    var mesi = {};
    righe.forEach(function (r) { if (r.data) mesi[meseDi(r.data)] = true; });
    o += '<div class="card" style="padding:12px 15px"><div class="row">' +
      '<select class="inp" style="max-width:200px" data-act="fVoce"><option value="">Tutte le voci</option>' +
      vociDi(tipo).map(function (v) { return '<option value="' + h(v) + '"' + (S.filtroVoce === v ? " selected" : "") + ">" + h(v) + "</option>"; }).join("") + "</select>" +
      '<select class="inp" style="max-width:160px" data-act="fStato"><option value="">Tutti gli stati</option>' +
      [["aperto", "Da pagare o parziali"], ["scaduto", "Scaduti"], ["saldato", "Saldati"]].map(function (x) {
        return '<option value="' + x[0] + '"' + (S.filtroStato === x[0] ? " selected" : "") + ">" + x[1] + "</option>";
      }).join("") + "</select>" +
      '<select class="inp" style="max-width:170px" data-act="fMese"><option value="">Tutti i mesi</option>' +
      Object.keys(mesi).sort().map(function (m) { return '<option value="' + m + '"' + (S.filtroMese === m ? " selected" : "") + ">" + h(nomeMese(m)) + "</option>"; }).join("") + "</select>" +
      '<button class="btn btn-sm btn-primary" data-act="nuovo" data-v="' + tipo + '">+ Nuova ' + (tipo === "uscita" ? "uscita" : "entrata") + "</button></div></div>";

    if (S.form && S.form.tipo === tipo) o += formMovimento();

    var mostrate = righe.filter(function (r) {
      if (S.filtroVoce && r.voce !== S.filtroVoce) return false;
      if (S.filtroMese && meseDi(r.data) !== S.filtroMese) return false;
      var st = statoDi(r);
      if (S.filtroStato === "saldato" && st.c !== "ok") return false;
      if (S.filtroStato === "scaduto" && st.c !== "crit") return false;
      if (S.filtroStato === "aperto" && st.c === "ok") return false;
      return true;
    }).sort(function (a, b) { return (b.data || "").localeCompare(a.data || ""); });

    o += '<div class="card"><div style="padding:14px 16px 4px"><div class="eyebrow">' + h(etichettaPeriodo()) + "</div>" +
      '<h2 class="sec-title">' + h(etichetta) + "</h2></div>";
    if (!mostrate.length) {
      o += '<div class="empty">Nessun movimento con questi filtri.</div></div>';
      return o;
    }
    o += '<div class="tablewrap"><table><thead><tr><th>Data</th><th>Voce</th><th>Descrizione</th>' +
      (tipo === "uscita" ? "<th>Centro di costo</th>" : "") +
      '<th class="num">Importo</th><th class="num">Residuo</th><th>Stato</th><th></th></tr></thead><tbody>';
    mostrate.forEach(function (r) {
      var st = statoDi(r), res = residuoDi(r);
      o += "<tr>" +
        '<td class="mono small">' + h(dataIt(r.data)) + (r.scadenza ? '<div class="tiny muted">scad. ' + h(dataIt(r.scadenza)) + "</div>" : "") + "</td>" +
        "<td><b>" + h(r.voce) + "</b>" + (r.palestra ? '<div class="tiny muted">' + h(nomePalestra(r.palestra)) + "</div>" : "") + "</td>" +
        "<td>" + h(r.descrizione) + (r.controparte ? '<div class="tiny muted">' + h(r.controparte) + "</div>" : "") + "</td>" +
        (tipo === "uscita" ? "<td class=\"small\">" + h(etichettaCentro(r)) + "</td>" : "") +
        '<td class="num">' + eur(r.importo) + "</td>" +
        '<td class="num"' + (res > 0.009 ? ' style="font-weight:600"' : "") + ">" + eur(res) + "</td>" +
        '<td><span class="pill pill-' + st.c + '"><span class="dot"></span>' + h(st.t) + "</span></td>" +
        '<td class="num"><button class="btn btn-xs" data-act="apri" data-v="' + h(r.id) + '">' + (S.aperto === r.id ? "Chiudi" : "Apri") + "</button></td></tr>";
      if (S.aperto === r.id) o += '<tr><td colspan="' + (tipo === "uscita" ? 8 : 7) + '" style="padding:0">' + dettaglio(r) + "</td></tr>";
    });
    o += "</tbody><tfoot><tr><td colspan=\"" + (tipo === "uscita" ? 4 : 3) + "\">Totale mostrato</td>" +
      '<td class="num">' + eur(mostrate.reduce(function (t, r) { return t + r.importo; }, 0)) + "</td>" +
      '<td class="num">' + eur(mostrate.reduce(function (t, r) { return t + residuoDi(r); }, 0)) + "</td><td colspan=\"2\"></td></tr></tfoot></table></div></div>";
    return o;
  }

  function etichettaCentro(r) {
    if (r.centroTipo === "corso") return r.centroValore;
    if (r.centroTipo === "settore") return r.centroValore;
    return "Comune, da ripartire";
  }

  function formMovimento() {
    var f = S.form, tipo = f.tipo;
    var o = '<div class="card formbox fade" style="padding:16px; margin:0">' +
      '<div class="eyebrow" style="margin-bottom:10px">' + (f.id ? "Modifica movimento" : (tipo === "uscita" ? "Nuova uscita" : "Nuova entrata")) + "</div>" +
      '<div class="row" style="align-items:flex-end">' +
      '<div class="field" style="max-width:160px"><label>Data</label><input class="inp mono" type="date" id="f-data" value="' + h(f.data || todayKey()) + '" data-autofocus></div>' +
      '<div class="field" style="max-width:220px"><label>Voce</label><select class="inp" id="f-voce">' +
      vociDi(tipo).map(function (v) { return '<option value="' + h(v) + '"' + (f.voce === v ? " selected" : "") + ">" + h(v) + "</option>"; }).join("") + "</select></div>" +
      '<div class="field" style="max-width:260px"><label>Descrizione</label><input class="inp" id="f-descr" value="' + h(f.descrizione || "") + '"></div>' +
      '<div class="field" style="max-width:220px"><label>' + (tipo === "uscita" ? "Fornitore" : "Da chi") + '</label><input class="inp" id="f-contro" value="' + h(f.controparte || "") + '"></div>' +
      '<div class="field" style="max-width:140px"><label>Importo</label><input class="inp mono" id="f-importo" inputmode="decimal" value="' + h(fmtNum(f.importo || "")) + '"></div>' +
      '<div class="field" style="max-width:160px"><label>Scadenza</label><input class="inp mono" type="date" id="f-scad" value="' + h(f.scadenza || "") + '"></div>' +
      "</div>";
    if (tipo === "uscita") {
      o += '<div class="row" style="align-items:flex-end; margin-top:10px">' +
        '<div class="field" style="max-width:180px"><label>Palestra</label><select class="inp" id="f-palestra"><option value="">nessuna</option>' +
        palestre().map(function (p) { return '<option value="' + h(p.id) + '"' + (f.palestra === p.id ? " selected" : "") + ">" + h(p.nome) + "</option>"; }).join("") + "</select></div>" +
        '<div class="field" style="max-width:300px"><label>Centro di costo</label><select class="inp" id="f-centro">' +
        '<option value="comune|"' + (f.centroTipo === "comune" ? " selected" : "") + ">Comune, da ripartire</option>" +
        SETTORI.map(function (x) { return '<option value="settore|' + h(x) + '"' + (f.centroTipo === "settore" && f.centroValore === x ? " selected" : "") + ">Settore: " + h(x) + "</option>"; }).join("") +
        corsi().map(function (c) { return '<option value="corso|' + h(c.nome) + '"' + (f.centroTipo === "corso" && f.centroValore === c.nome ? " selected" : "") + ">Corso: " + h(c.nome) + "</option>"; }).join("") +
        "</select></div></div>";
    }
    o += '<div class="field" style="margin-top:10px"><label>Note</label><input class="inp" id="f-note" value="' + h(f.note || "") + '"></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="salvaMov">Salva</button>' +
      '<button class="btn btn-quiet" data-act="chiudiForm">Annulla</button></div></div>';
    return o;
  }

  function dettaglio(r) {
    var res = residuoDi(r);

  // --------------------------------------------------------- centri di costo
  function ripartizione(r) {
    // restituisce { nomeCorso: quota } per un movimento comune
    var out = {}, cs = corsi();
    if (CFG().criterio !== "ore") return out;
    var base = 0, chiave = r.palestra || "";
    if (chiave) base = oreInPalestra(chiave); else base = oreTotali();
    if (!base) return out;
    cs.forEach(function (c) {
      var ore = chiave ? num((c.ore || {})[chiave]) : oreCorso(c);
      if (ore > 0) out[c.nome] = (ore / base) * r.importo;
    });
    return out;
  }
  function costiPerCorso() {
    var perCorso = {}, nonRipartito = 0;
    corsi().forEach(function (c) { perCorso[c.nome] = { diretti: 0, ripartiti: 0 }; });
    righeDellAnno().filter(function (r) { return r.tipo === "uscita"; }).forEach(function (r) {
      if (r.centroTipo === "corso" && perCorso[r.centroValore]) { perCorso[r.centroValore].diretti += r.importo; return; }
      if (r.centroTipo === "settore") {
        var lista = corsi().filter(function (c) { return c.settore === r.centroValore; });
        var tot = lista.reduce(function (t, c) { return t + oreCorso(c); }, 0);
        if (!tot) { nonRipartito += r.importo; return; }
        lista.forEach(function (c) { perCorso[c.nome].ripartiti += (oreCorso(c) / tot) * r.importo; });
        return;
      }
      var q = ripartizione(r), somma = 0;
      Object.keys(q).forEach(function (k) { if (perCorso[k]) { perCorso[k].ripartiti += q[k]; somma += q[k]; } });
      nonRipartito += r.importo - somma;
    });
    return { perCorso: perCorso, nonRipartito: nonRipartito };
  }

  function vistaCentri() {
    var d = costiPerCorso();
    var righe = corsi().map(function (c) {
      var x = d.perCorso[c.nome] || { diretti: 0, ripartiti: 0 };
      return { nome: c.nome, settore: c.settore || "Senza settore", ore: oreCorso(c), diretti: x.diretti, ripartiti: x.ripartiti, tot: x.diretti + x.ripartiti };
    });
    var totale = righe.reduce(function (t, r) { return t + r.tot; }, 0);
    var maxV = righe.reduce(function (m, r) { return Math.max(m, r.tot); }, 0) || 1;

    var o = "";
    if (!oreTotali()) {
      o += '<div class="banner banner-warn">Non ci sono ancora le ore settimanali dei corsi, quindi i costi comuni non si possono ripartire. Le trovi in Impostazioni, oppure le importi da Anagrafiche.</div>';
    }
    o += '<div class="tiles">' +
      tile("Uscite " + etichettaPeriodo(), eur(righeDellAnno().filter(function (r) { return r.tipo === "uscita"; }).reduce(function (t, r) { return t + r.importo; }, 0)), "totale", false) +
      tile("Attribuite", eur(totale), "ai corsi", false) +
      tile("Non ripartite", eur(d.nonRipartito), "mancano le ore o il criterio", d.nonRipartito > 0.009) +
      tile("Ore settimanali", fmtNum(Math.round(oreTotali() * 100) / 100), "somma dei corsi", false) +
      "</div>";

    // per settore
    var perSettore = {};
    righe.forEach(function (r) {
      if (!perSettore[r.settore]) perSettore[r.settore] = 0;
      perSettore[r.settore] += r.tot;
    });
    var chiavi = Object.keys(perSettore).sort(function (a, b) {
      var ia = SETTORI.indexOf(a), ib = SETTORI.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    var maxS = chiavi.reduce(function (m, k) { return Math.max(m, perSettore[k]); }, 0) || 1;
    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Sintesi</div>' +
      '<h2 class="sec-title">Costo per settore</h2></div><div class="chart">';
    chiavi.forEach(function (k) {
      o += '<div class="crow"><div class="cname">' + h(k) + "</div>" +
        '<div class="ctrack"><div class="cnet" style="width:' + Math.round((perSettore[k] / maxS) * 100) + '%"></div></div>' +
        '<div class="cval">' + eur(perSettore[k]) + "</div></div>";
    });
    o += "</div></div>";

    o += '<div class="card"><div style="padding:14px 16px 4px"><div class="eyebrow">Dettaglio</div>' +
      '<h2 class="sec-title">Costo per corso</h2>' +
      '<p class="small muted" style="margin:3px 0 0">I costi diretti sono quelli attribuiti a un corso preciso. I ripartiti arrivano dalle spese comuni, divise in proporzione alle ore di palestra.</p></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Corso</th><th>Settore</th><th class="num">Ore/sett</th><th class="num">Diretti</th><th class="num">Ripartiti</th><th></th><th class="num">Totale</th></tr></thead><tbody>';
    righe.forEach(function (r) {
      o += "<tr><td><b>" + h(r.nome) + "</b></td><td class=\"small muted\">" + h(r.settore) + "</td>" +
        '<td class="num muted">' + fmtNum(Math.round(r.ore * 100) / 100) + "</td>" +
        '<td class="num">' + eur(r.diretti) + "</td>" +
        '<td class="num muted">' + eur(r.ripartiti) + "</td>" +
        '<td><div class="barbg"><div class="bar" style="width:' + Math.round((r.tot / maxV) * 100) + '%"></div></div></td>' +
        '<td class="num"><b>' + eur(r.tot) + "</b></td></tr>";
    });
    o += '</tbody><tfoot><tr><td colspan="6">Totale attribuito</td><td class="num">' + eur(totale) + "</td></tr></tfoot></table></div></div>";

    // margine per corso
    var haEntrate = corsi().some(function (c) { return num(c.dovuto) > 0; });
    var mar = corsi().map(function (c) {
      var x = d.perCorso[c.nome] || { diretti: 0, ripartiti: 0 };
      return { nome: c.nome, valore: num(c.dovuto) - (x.diretti + x.ripartiti), entrate: num(c.dovuto), costi: x.diretti + x.ripartiti };
    }).filter(function (r) { return r.entrate || r.costi; })
      .sort(function (a, b) { return a.valore - b.valore; });

    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">La domanda vera</div>' +
      '<h2 class="sec-title">Quale corso si regge da sé</h2>' +
      '<p class="small muted" style="margin:3px 0 8px">' +
      (haEntrate
        ? "A destra dello zero i corsi che coprono i propri costi, a sinistra quelli sostenuti dagli altri. Le entrate sono le rette dovute della stagione" +
          (modoPeriodo() === "stagione" ? ", i costi quelli del periodo scelto." : ", mentre i costi sono quelli dell'anno solare scelto: se passi a ragionare per stagione dalle impostazioni, i due periodi coincidono e il confronto diventa esatto.")
        : "Mancano le entrate dei corsi. Rifai l'ossatura dalle Anagrafiche: adesso porta con sé anche le rette dovute e incassate di ogni corso.") +
      "</p></div>";
    o += haEntrate ? barreDivergenti(mar, { fmt: function (v) { return eur(v); } }) : '<div class="empty">Niente da mostrare finché non arrivano le entrate per corso.</div>';
    if (haEntrate) {
      o += '<div class="tablewrap"><table><thead><tr><th>Corso</th><th class="num">Iscritte</th><th class="num">Entrate</th><th class="num">Costi</th><th class="num">Margine</th></tr></thead><tbody>';
      mar.forEach(function (r) {
        var c0 = corsi().filter(function (x) { return x.nome === r.nome; })[0] || {};
        o += "<tr><td>" + h(r.nome) + "</td>" +
          '<td class="num muted">' + (num(c0.iscritte) || "—") + "</td>" +
          '<td class="num">' + eur(r.entrate) + "</td>" +
          '<td class="num">' + eur(r.costi) + "</td>" +
          '<td class="num" style="color:' + (r.valore >= 0 ? "var(--ok)" : "var(--crit)") + '"><b>' + eur(r.valore) + "</b></td></tr>";
      });
      o += "</tbody></table></div>";
    }
    o += "</div>";
    return o;
  }

  // --------------------------------------------------------- andamento
  function saldiMensili(ancora) {
    var mesi = mesiDelPeriodo(ancora), per = {}, out = [];
    mesi.forEach(function (k) { per[k] = { e: 0, u: 0 }; });
    tutteLeRighe().forEach(function (r) {
      r.pagamenti.forEach(function (pg) {
        var k = meseDi(pg.data);
        if (!per[k]) return;
        if (r.tipo === "entrata") per[k].e += pg.importo; else per[k].u += pg.importo;
      });
    });
    var cum = 0;
    mesi.forEach(function (k) {
      var v = per[k];
      cum += v.e - v.u;
      out.push({ mese: k, entrate: v.e, uscite: v.u, saldo: cum });
    });
    return out;
  }


  function vistaAndamento() {
    var righe = righeDellAnno(), perMese = {};
    mesiDelPeriodo().forEach(function (k) { perMese[k] = { e: 0, u: 0 }; });
    righe.forEach(function (r) {
      r.pagamenti.forEach(function (p) {
        var k = meseDi(p.data);
        if (!perMese[k]) perMese[k] = { e: 0, u: 0 };
        if (r.tipo === "entrata") perMese[k].e += p.importo; else perMese[k].u += p.importo;
      });
    });
    var chiavi = mesiDelPeriodo();
    var totE = 0, totU = 0;
    chiavi.forEach(function (k) { totE += perMese[k].e; totU += perMese[k].u; });
    var max = chiavi.reduce(function (mx, k) { return Math.max(mx, perMese[k].e, perMese[k].u); }, 0) || 1;

    var o = '<div class="tiles">' +
      tile("Entrate incassate", eur(totE), "nel " + etichettaPeriodo(), false) +
      tile("Uscite pagate", eur(totU), "nel " + etichettaPeriodo(), false) +
      tile("Saldo", eur(totE - totU), totE - totU >= 0 ? "avanzo di cassa" : "disavanzo di cassa", totE - totU < 0) +
      tile("Impegni aperti", eur(righe.reduce(function (t, r) { return t + (r.tipo === "uscita" ? residuoDi(r) : 0); }, 0)), "uscite ancora da pagare", false) +
      "</div>";

    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Cassa</div>' +
      '<h2 class="sec-title">Mese per mese</h2>' +
      '<p class="small muted" style="margin:3px 0 6px">Conta quando i soldi si muovono davvero, cioè la data dei pagamenti, non quella dei documenti.</p></div>' +
      '<div class="legend"><span><i style="background:var(--data)"></i>Entrate</span><span><i style="background:var(--data-weak)"></i>Uscite</span></div>' +
      '<div class="chart">';
    var cum = 0;
    chiavi.forEach(function (k) {
      var v = perMese[k] || { e: 0, u: 0 };
      cum += v.e - v.u;
      o += '<div class="crow"><div class="cname">' + h(MESI[+k.slice(5, 7) - 1] + (modoPeriodo() === "stagione" ? " " + k.slice(2, 4) : "")) + "</div>" +
        '<div class="ctrack"><div class="cpres" style="width:' + Math.round((v.u / max) * 100) + '%"></div>' +
        '<div class="cnet" style="width:' + Math.round((v.e / max) * 100) + '%; height:8px; top:4px"></div></div>' +
        '<div class="cval"' + (cum < 0 ? ' style="color:var(--crit)"' : "") + ">" + eur(cum) + "</div></div>";
    });
    o += '</div><div class="row" style="padding:10px 16px; border-top:1px solid var(--line)"><span class="tiny muted">La cifra a destra è il saldo che si accumula mese dopo mese.</span></div></div>';

    // linea del saldo, con l'anno precedente a confronto
    var annoPrec = String(+S.anno - 1);
    var curr = saldiMensili(S.anno), prec = saldiMensili(annoPrec);
    var haPrec = prec.some(function (x) { return x.entrate || x.uscite; });
    var serie = [{ nome: "Saldo " + etichettaPeriodo(S.anno), valori: curr.map(function (x) { return x.saldo; }) }];
    if (haPrec) serie.push({ nome: "Saldo " + etichettaPeriodo(annoPrec), tratteggio: true, valori: prec.map(function (x) { return x.saldo; }) });
    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Cassa</div>' +
      '<h2 class="sec-title">Come va il saldo ' + (modoPeriodo() === "anno" ? "lungo l\'anno" : "lungo la stagione") + "</h2>" +
      '<p class="small muted" style="margin:3px 0 6px">' +
      (haPrec ? "La linea piena è quest'anno, quella tratteggiata l'anno prima: serve a capire se una discesa è normale oppure no."
              : "Quando ci sarà anche l'anno precedente comparirà una seconda linea, per capire se una discesa è normale oppure no.") +
      " La riga orizzontale più marcata è lo zero.</p></div>" +
      graficoLinee(serie, mesiDelPeriodo().map(function (k) { return MESI[+k.slice(5, 7) - 1].slice(0, 3); }), { titolo: "saldo di cassa mese per mese", fmtY: function (v) { return eur(v); } }) +
      "</div>";


    // per voce
    var perVoce = {};
    righe.forEach(function (r) {
      var k = (r.tipo === "uscita" ? "U|" : "E|") + r.voce;
      perVoce[k] = (perVoce[k] || 0) + r.importo;
    });
    var vociU = Object.keys(perVoce).filter(function (k) { return k.charAt(0) === "U"; }).sort(function (a, b) { return perVoce[b] - perVoce[a]; });
    if (vociU.length) {
      var maxU = perVoce[vociU[0]] || 1;
      o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">Composizione</div>' +
        '<h2 class="sec-title">Uscite per voce</h2></div><div class="chart">';
      vociU.forEach(function (k) {
        o += '<div class="crow"><div class="cname">' + h(k.slice(2)) + "</div>" +
          '<div class="ctrack"><div class="cnet" style="width:' + Math.round((perVoce[k] / maxU) * 100) + '%"></div></div>' +
          '<div class="cval">' + eur(perVoce[k]) + "</div></div>";
      });
      o += "</div></div>";
    }
    return o;
  }

  function leggiCfg() {
    var c = JSON.parse(JSON.stringify(CFG()));
    Array.prototype.forEach.call(document.querySelectorAll("[data-pal]"), function (e) {
      c.palestre.forEach(function (p) { if (p.id === e.dataset.pal && e.value.trim()) p.nome = e.value.trim(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-vu]"), function (e) {
      if (e.value.trim()) c.vociUscita[+e.dataset.vu] = e.value.trim();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-ve]"), function (e) {
      if (e.value.trim()) c.vociEntrata[+e.dataset.ve] = e.value.trim();
    });
    var cr = document.getElementById("f-criterio");
    if (cr) c.criterio = cr.value;
    var pe = document.getElementById("f-periodo");
    if (pe) c.periodo = pe.value;
    var mi = document.getElementById("f-meseinizio");
    if (mi) c.meseInizio = +mi.value;
    var pn = document.getElementById("f-pinnew");
    if (pn && pn.value.trim()) c.pin = pn.value.trim();
    S.cfg = c;
    return c;
  }

  function importaOssatura(testo) {
    var linee = String(testo).replace(/\r\n/g, "\n").split("\n").filter(function (l) { return l.trim(); });
    if (linee.length < 2) return { ok: false, msg: "Non c'è niente da leggere." };
    var sep = linee[0].indexOf("\t") >= 0 ? "\t" : (linee[0].split(";").length > linee[0].split(",").length ? ";" : ",");
    var intest = linee[0].split(sep).map(function (x) { return x.trim().toLowerCase(); });
    var iC = intest.indexOf("corso"), iS = intest.indexOf("settore"), iP = intest.indexOf("palestra"), iO = intest.indexOf("ore");
    var iI = intest.indexOf("iscritte"), iD = intest.indexOf("dovuto"), iN = intest.indexOf("incassato");
    if (iC < 0 || iP < 0 || iO < 0) return { ok: false, msg: "Servono le colonne Corso, Palestra e Ore nella prima riga." };
    var c = JSON.parse(JSON.stringify(CFG()));
    var mappaPal = {}, nuoviCorsi = {};
    c.palestre.forEach(function (p) { mappaPal[p.nome.toLowerCase()] = p.id; });
    for (var i = 1; i < linee.length; i++) {
      var col = linee[i].split(sep).map(function (x) { return x.trim(); });
      var nomeC = col[iC], nomeP = col[iP], ore = num(col[iO]);
      if (!nomeC) continue;
      if (!nuoviCorsi[nomeC]) {
        nuoviCorsi[nomeC] = {
          nome: nomeC, settore: iS >= 0 ? col[iS] : settoreDi(nomeC), ore: {},
          iscritte: iI >= 0 ? num(col[iI]) : 0,
          dovuto: iD >= 0 ? num(col[iD]) : 0,
          incassato: iN >= 0 ? num(col[iN]) : 0
        };
      }
      if (!nomeP) continue;
      var pid = mappaPal[nomeP.toLowerCase()];
      if (!pid) {
        pid = "pa" + Date.now().toString(36) + i;
        c.palestre.push({ id: pid, nome: nomeP });
        mappaPal[nomeP.toLowerCase()] = pid;
      }
      nuoviCorsi[nomeC].ore[pid] = ore;
    }
    var elenco = Object.keys(nuoviCorsi);
    if (!elenco.length) return { ok: false, msg: "Nessuna riga valida." };
    c.corsi = elenco.map(function (k) { return nuoviCorsi[k]; });
    return { ok: true, cfg: c, n: elenco.length };
  }

  function csvMovimenti() {
    var out = [["Tipo", "Data", "Voce", "Descrizione", "Controparte", "Palestra", "Centro di costo", "Importo", "Scadenza", "Pagato", "Residuo", "Stato", "Note"]];
    righeDellAnno().sort(function (a, b) { return (a.data || "").localeCompare(b.data || ""); }).forEach(function (r) {
      out.push([r.tipo, r.data, r.voce, r.descrizione, r.controparte, nomePalestra(r.palestra),
        r.tipo === "uscita" ? etichettaCentro(r) : "", eur(r.importo), r.scadenza,
        eur(pagatoDi(r)), eur(residuoDi(r)), statoDi(r).t, r.note]);
      r.pagamenti.forEach(function (p) {
        out.push(["pagamento", p.data, r.voce, r.descrizione, "", "", "", eur(p.importo), "", "", "", p.modalita, ""]);
      });
    });
    return out.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";");
    }).join("\r\n");
  }

  // --------------------------------------------------------- eventi
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act, v = t.dataset.v;

    if (act === "pin") {
      var p = document.getElementById("f-pin");
      if (p && p.value === String(CFG().pin || "2468")) { S.sbloccato = true; render(); }
      else toast("Codice non corretto.");
      return;
    }
    if (act === "vista") { S.vista = v; S.form = null; S.aperto = ""; S.pagForm = null; render(); return; }
    if (act === "anno" || act === "fVoce" || act === "fStato" || act === "fMese") return;

    if (act === "nuovo") { S.form = { tipo: v, data: todayKey(), voce: vociDi(v)[0] || "", centroTipo: "comune", centroValore: "" }; S.aperto = ""; render(); return; }
    if (act === "chiudiForm") { S.form = null; render(); return; }
    if (act === "modifica") {
      var rm = tutteLeRighe().filter(function (x) { return x.id === v; })[0];
      if (!rm) return;
      S.form = JSON.parse(JSON.stringify(rm)); S.aperto = ""; render(); return;
    }
    if (act === "salvaMov") {
      var f = S.form; if (!f) return;
      var data = (document.getElementById("f-data") || {}).value || "";
      var voce = (document.getElementById("f-voce") || {}).value || "";
      var descr = ((document.getElementById("f-descr") || {}).value || "").trim();
      var contro = ((document.getElementById("f-contro") || {}).value || "").trim();
      var importo = num((document.getElementById("f-importo") || {}).value);
      var scad = (document.getElementById("f-scad") || {}).value || "";
      var note = ((document.getElementById("f-note") || {}).value || "").trim();
      var pal = (document.getElementById("f-palestra") || {}).value || "";
      var centro = (document.getElementById("f-centro") || {}).value || "comune|";
      if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { toast("Serve la data del movimento."); return; }
      if (!importo) { toast("Serve un importo."); return; }
      var parti = centro.split("|");
      var anno = data.slice(0, 4);
      var id = f.id || "m" + Date.now().toString(36) + Math.floor(Math.random() * 900 + 100);
      var riga = {
        tipo: f.tipo, data: data, voce: voce, descrizione: descr, controparte: contro,
        palestra: f.tipo === "uscita" ? pal : "", importo: importo, scadenza: scad,
        centroTipo: f.tipo === "uscita" ? parti[0] : "", centroValore: f.tipo === "uscita" ? (parti[1] || "") : "",
        pagamenti: f.pagamenti || [], note: note, aggiornatoAlle: nowIso()
      };
      var annoVecchio = f.anno && f.anno !== anno ? f.anno : null;
      S.form = null;
      scriviRiga(anno, id, riga)
        .then(function () {
          if (annoVecchio) {
            var vuota = {}; vuota[id] = { rimossa: true };
            return S.db.doc("movimenti/a" + annoVecchio).update({ righe: vuota }).catch(function () {});
          }
        })
        .then(function () { S.anno = anno; toast("Movimento salvato.", true); })
        .catch(function () { toast("Non è stato possibile salvare."); });
      return;
    }
    if (act === "apri") { S.aperto = S.aperto === v ? "" : v; S.pagForm = null; render(); return; }
    if (act === "elimina") {
      var re = tutteLeRighe().filter(function (x) { return x.id === v; })[0];
      if (!re || !S.db) return;
      var vuota2 = {}; vuota2[v] = { rimossa: true };
      S.aperto = "";
      S.db.doc("movimenti/a" + re.anno).update({ righe: vuota2 })
        .then(function () { toast("Movimento eliminato.", true); })
        .catch(function () { toast("Non è stato possibile eliminare."); });
      return;
    }
    if (act === "apriPag") { S.pagForm = v; render(); return; }
    if (act === "chiudiPag") { S.pagForm = null; render(); return; }
    if (act === "confermaPag") {
      var rp = tutteLeRighe().filter(function (x) { return x.id === v; })[0];
      if (!rp) return;
      var pd = (document.getElementById("f-pdata") || {}).value || todayKey();
      var pi = num((document.getElementById("f-pimp") || {}).value);
      var pm = (document.getElementById("f-pmod") || {}).value || "Bonifico";
      if (!pi) { toast("Serve un importo."); return; }
      var lista = rp.pagamenti.slice();
      lista.push({ data: pd, importo: pi, modalita: pm });
      S.pagForm = null;
      scriviRiga(rp.anno, v, { pagamenti: lista })
        .then(function () { toast("Pagamento registrato.", true); })
        .catch(function () { toast("Non è stato possibile registrare."); });
      return;
    }
    if (act === "delPag") {
      var rd = tutteLeRighe().filter(function (x) { return x.id === v; })[0];
      if (!rd) return;
      var l2 = rd.pagamenti.slice();
      l2.splice(+t.dataset.i, 1);
      scriviRiga(rd.anno, v, { pagamenti: l2 }).catch(function () { toast("Non è stato possibile aggiornare."); });
      return;
    }

    if (act === "addPal") { var c1 = leggiCfg(); c1.palestre.push({ id: "pa" + Date.now().toString(36), nome: "Nuova palestra" }); S.cfg = c1; render(); return; }
    if (act === "delPal") {
      var c2 = leggiCfg();
      c2.palestre = c2.palestre.filter(function (p) { return p.id !== v; });
      c2.corsi.forEach(function (co) { if (co.ore) delete co.ore[v]; });
      S.cfg = c2; render(); return;
    }
    if (act === "addVoceU") { var c3 = leggiCfg(); c3.vociUscita.push("Nuova voce"); S.cfg = c3; render(); return; }
    if (act === "delVoceU") { var c4 = leggiCfg(); c4.vociUscita.splice(+v, 1); S.cfg = c4; render(); return; }
    if (act === "addVoceE") { var c5 = leggiCfg(); c5.vociEntrata.push("Nuova voce"); S.cfg = c5; render(); return; }
    if (act === "delVoceE") { var c6 = leggiCfg(); c6.vociEntrata.splice(+v, 1); S.cfg = c6; render(); return; }
    if (act === "salvaCfg") { salvaCfg(leggiCfg()).then(function () { toast("Impostazioni salvate.", true); }); return; }
    if (act === "importaOss") {
      var ta = document.getElementById("f-oss");
      var res = importaOssatura(ta ? ta.value : "");
      if (!res.ok) { toast(res.msg); return; }
      S.impImport = "";
      salvaCfg(res.cfg).then(function () { toast(res.n + " corsi importati con le loro ore.", true); });
      return;
    }
    if (act === "csv") {
      if (!S.downloads) { toast("Il download non è disponibile in questa vista."); return; }
      S.downloads.save({ filename: "conti-" + S.anno + ".csv", data: "﻿" + csvMovimenti() })
        .catch(function (e) { if (e && e.code !== "declined") toast("Non è stato possibile creare il file."); });
      return;
    }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t.dataset || !t.dataset.act) return;
    if (t.dataset.act === "anno") { S.anno = t.value; S.aperto = ""; render(); return; }
    if (t.dataset.act === "fVoce") { S.filtroVoce = t.value; render(); return; }
    if (t.dataset.act === "fStato") { S.filtroStato = t.value; render(); return; }
    if (t.dataset.act === "fMese") { S.filtroMese = t.value; render(); return; }
  });

  function attach() {
    S.db.doc("config/setup").onSnapshot(function (snap) {
      if (snap.exists) {
        var d = snap.data();
        if (d && d.corsi) S.cfg = d;
      }
      render();
    }, function () {});
    S.db.collection("movimenti").limit(30).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var b = d.data() || {};
        m[d.id.slice(1)] = { righe: b.righe || {} };
      });
      S.anni = m;
      render();
    }, function () { S.err = "I movimenti non si stanno aggiornando. Ricarica la pagina."; render(); });
  }

  function boot() {
    window.ZODIACO_PRONTO = function () { S.sbloccato = true; render(); };
    render();
    if (!(window.claude && typeof window.claude.use === "function")) {
      S.err = "Questa anteprima non è collegata all'archivio: le modifiche non vengono salvate."; render(); return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) { S.err = "Archivio non disponibile in questa vista."; render(); return; }
      S.db = db; attach();
    }).catch(function () { S.err = "Archivio non raggiungibile."; render(); });
    window.claude.use("downloads").then(function (d) { S.downloads = d; }).catch(function () {});
  }
  boot();
})();
</script>
