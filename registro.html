<style>
  :root {
    --paper:#F2F2F1; --surface:#FFFFFF; --surface-2:#E9E9E7; --surface-3:#DEDEDB;
    --ink:#15161A; --ink-2:#54565C; --ink-3:#828489;

    --data:#2A2C31; --data-weak:#CFCFCC;

    --warn:#8A5708; --warn-soft:#F6EAD6;
    --crit:#A81326; --crit-soft:#FAE3E5;

    --f-ui:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --r:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#111113; --surface:#191A1D; --surface-2:#232427; --surface-3:#2C2D31;

      --line:#2D2E32; --line-strong:#3D3E43;

      --ok:#7FC49B; --ok-soft:#18241D;
      --warn:#DDAA55; --warn-soft:#282017;
      --crit:#F2606F; --crit-soft:#2E1A1D;
    }
  }

    --paper:#111113; --surface:#191A1D; --surface-2:#232427; --surface-3:#2C2D31;
    --ink:#EBEBE9; --ink-2:#A8A9AC; --ink-3:#7C7D81;
    --line:#2D2E32; --line-strong:#3D3E43;
    --accent:#F2606F; --accent-ink:#F2606F; --accent-soft:#2E1A1D; --on-accent:#17090B;

    --warn:#DDAA55; --warn-soft:#282017;
    --crit:#F2606F; --crit-soft:#2E1A1D;

  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2 { margin:0; font-family:var(--f-display); font-weight:600; text-wrap:balance; letter-spacing:-0.01em; }
  button { font-family:inherit; font-size:inherit; cursor:pointer; }
  input, select { font-family:inherit; font-size:inherit; color:var(--ink); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .mono { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }

  .logo-lg { width:96px; height:67px; }
  .topbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1060px; margin:0 auto; padding:14px 18px 0; }
  .brand { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .brand h1 { font-size:21px; }
  .brand .sub { font-size:11.5px; color:var(--ink-3); letter-spacing:0.08em; text-transform:uppercase; }
  .tabs { display:flex; gap:2px; margin-top:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { appearance:none; background:none; border:none; border-bottom:2px solid transparent; padding:8px 12px 10px; color:var(--ink-2); font-weight:500; white-space:nowrap; flex:none; }
  .tab[aria-selected="true"] { color:var(--accent-ink); border-bottom-color:var(--accent); }
  main { max-width:720px; margin:0 auto; padding:20px 16px 90px; }
  main.wide { max-width:1060px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--ink-2); }
  .small { font-size:13px; }
  .tiny { font-size:12px; }
  .eyebrow { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .sec-title { font-size:17px; }
  .divider { height:1px; background:var(--line); border:0; margin:0; }

  .btn { border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:8px; font-weight:500; }
  .btn:hover { background:var(--surface-2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn-primary:hover { filter:brightness(1.08); }
  .btn-quiet { border-color:transparent; background:var(--surface-2); }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .btn-xs { padding:4px 8px; font-size:12px; }

  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; font-weight:600; letter-spacing:0.03em; color:var(--ink-2); text-transform:uppercase; }
  .inp { background:var(--surface); border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; width:100%; }
  .inp:focus { border-color:var(--accent); }

  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .pill-ok { background:var(--ok-soft); color:var(--ok); }
  .pill-warn { background:var(--warn-soft); color:var(--warn); }
  .pill-crit { background:var(--crit-soft); color:var(--crit); }
  .pill-idle { background:var(--surface-2); color:var(--ink-3); }
  .pill-live { background:var(--accent-soft); color:var(--accent-ink); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  @media (prefers-reduced-motion: no-preference) {
    .pill-live .dot { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .fade { animation:f .2s ease-out; } @keyframes f { from { opacity:0; transform:translateY(3px); } }
  }

  .dayhead { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; padding:16px 18px; flex-wrap:wrap; }
  .dayhead .d { font-family:var(--f-display); font-size:23px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; }
  .tile .k { font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  .tile .v { font-family:var(--f-mono); font-size:26px; font-weight:500; margin-top:5px; letter-spacing:-0.02em; }
  .tile .n { font-size:12px; color:var(--ink-2); margin-top:2px; }
  .tile.alert .v { color:var(--crit); }

  .ins { border-bottom:1px solid var(--line); padding:11px 16px; }
  .ins:last-child { border-bottom:0; }
  .ins-top { display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
  .ins-name { font-family:var(--f-display); font-size:17px; line-height:1.25; }
  .ins-tot { font-family:var(--f-mono); font-size:15px; font-variant-numeric:tabular-nums; text-align:right; flex:none; }
  .ins-tot .sec { font-size:11.5px; color:var(--ink-3); display:block; }
  .turni { margin-top:5px; display:flex; flex-wrap:wrap; gap:6px; }
  .turno { font-family:var(--f-mono); font-size:12px; background:var(--surface-2); color:var(--ink-2); padding:2px 7px; border-radius:5px; }
  .turno.aperto { background:var(--accent-soft); color:var(--accent-ink); }
  .turno.rotto { background:var(--crit-soft); color:var(--crit); }
  .confirm { margin-top:11px; background:var(--surface-2); border-radius:9px; padding:14px; }
  .bigtime { font-family:var(--f-mono); font-size:36px; font-weight:500; letter-spacing:0.02em; line-height:1.1; }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px; }
  .seg button { border:none; background:none; padding:6px 11px; border-radius:6px; color:var(--ink-2); font-weight:500; font-size:13.5px; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th { text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
  tfoot td { font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0; }

  /* grafico ore */
  .chart { padding:4px 16px 16px; }
  .crow { display:grid; grid-template-columns:minmax(96px,1fr) 3fr auto; gap:10px; align-items:center; padding:5px 0; }
  .ctrack { position:relative; height:16px; }
  .cpres { position:absolute; inset:0 auto 0 0; height:16px; border-radius:4px; background:var(--data-weak); }
  .cnet { position:absolute; top:0; left:0; height:16px; border-radius:4px; background:var(--data); }
  .cname { font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cval { font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .legend { display:flex; gap:16px; padding:2px 16px 10px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  details.day { border-bottom:1px solid var(--line); }
  details.day:last-child { border-bottom:0; }
  details.day > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  details.day > summary::-webkit-details-marker { display:none; }
  details.day > summary:hover { background:var(--surface-2); }
  .daydate { font-family:var(--f-display); font-size:16px; }

  .empty { padding:32px 18px; text-align:center; color:var(--ink-2); }
  .chk { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .chk.off { opacity:.5; }
  .chk .nm { flex:1; font-size:14.5px; }
  .chk select { max-width:170px; }
  .griglia { display:grid; gap:8px; grid-template-columns:1fr; }
  @media (min-width:700px) { .griglia { grid-template-columns:1fr 1fr; } }
  .formbox { background:var(--surface-2); border-radius:10px; padding:14px; margin:12px 16px; }
  .formrow { display:grid; gap:10px; grid-template-columns:1fr; }
  @media (min-width:640px) { .formrow { grid-template-columns:1fr 1fr 110px 1fr; align-items:end; } }
  .subtabs { display:flex; gap:4px; padding:0 16px 12px; flex-wrap:wrap; }
  .subtabs button { border:1px solid var(--line-strong); background:var(--surface); padding:6px 12px; border-radius:999px; font-size:13.5px; color:var(--ink-2); }

  function traduci(e) {
    var c = (e && e.code) || "";

            return F.onSnapshot(
              F.query(F.collection(db, radice + percorso), ...vincoli),
              function (qs) { cb(vestiTanti(qs)); },
              function (e) { if (err) err(e); }

          U.sendPasswordResetEmail(auth, ind)
            .then(function () { avviso("Ti è stata inviata una email per rifare la password. Controlla anche la posta indesiderata.", true); })
            .catch(function (e) { avviso(traduci(e)); });
        });
        setTimeout(function () { em.focus(); }, 60);
      }

      function fermati(titolo, testo) {
        schermata(titolo, testo, '<div class="riga"><button type="button" class="g" id="zod-esci">Esci</button></div>');
        document.getElementById("zod-esci").addEventListener("click", esci);

      var giaAperto = false;

      U.onAuthStateChanged(auth, function (u) {
        if (!u) { if (!giaAperto) chiediAccesso(""); return; }
        schermata("Un momento", "Sto controllando il tuo profilo.");
        var chiave = (u.email || "").toLowerCase();

          window.ZODIACO.gestione = ruolo === "gestione";

          if (typeof window.ZODIACO_PRONTO === "function") { try { window.ZODIACO_PRONTO(); } catch (e) {} }
          apri(dammi);
        }).catch(function (e) {
          fermati("Non riesco a leggere il tuo profilo", traduci(e));
        });
      });
    }).catch(function () {
      schermata("Collegamento non riuscito",
        "Non sono riuscita a raggiungere i servizi di Firebase. Controlla la connessione, e se hai una VPN accesa prova a spegnerla, poi ricarica la pagina.");
    });
  }

  if (document.body) parti();
  else document.addEventListener("DOMContentLoaded", parti);
})();

<script>
(function () {
  "use strict";

  var GIORNI = ["", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato", "domenica"];
  var MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

  function h(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dateOf(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayKey() { return keyOf(new Date()); }
  function dowOf(k) { var d = dateOf(k).getDay(); return d === 0 ? 7 : d; }
  function longDate(k) { var d = dateOf(k); return GIORNI[dowOf(k)] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear(); }
  function shortDate(k) { var d = dateOf(k); return GIORNI[dowOf(k)].slice(0, 3) + " " + d.getDate() + " " + MESI[d.getMonth()].slice(0, 3); }
  function addDays(k, n) { var d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function toMin(t) {
    if (!/^\d{1,2}:\d{2}$/.test(String(t || "").trim())) return null;
    var p = String(t).trim().split(":"), a = +p[0], b = +p[1];
    return a > 23 || b > 59 ? null : a * 60 + b;
  }
  function fmtMin(m) {
    var a = Math.abs(Math.round(m || 0)), s = (m || 0) < 0 ? "-" : "";
    return s + Math.floor(a / 60) + "h " + pad(a % 60);
  }
  function fmtDur(m) {
    var a = Math.max(0, Math.round(m || 0)), hh = Math.floor(a / 60), mm = a % 60;
    return (hh ? hh + "h " : "") + mm + "m";
  }
  function fmtOre(m) { return ((m || 0) / 60).toFixed(2).replace(".", ","); }
  function nowIso() { return new Date().toISOString(); }

  var NOMI = ["Francesca M.","Valentina G.","Ludovica P.","Licia L.","Clio M.","Marianna V.","Isotta S.","Clarissa R.","Gaia M.","Chiara M.","Asia S.","Noemi T.","Gaia R.","Sofia T.","Sole C.","Lucia A.","Annachiara T.","Elisa Gad.","Elisa Guer.","Manuel G."];

  var CONFIG_DEF = {
    oraChiusura: "22:00",
    pinGestione: "2468",
    tolleranzaRitardo: 5,
    insegnanti: NOMI.map(function (n, i) { return { id: "p" + (i + 1), nome: n, attesi: {} }; })
  };

  var S = {
    db: null, downloads: null, err: "", toast: "", toastOk: false,
    config: JSON.parse(JSON.stringify(CONFIG_DEF)),
    giorni: {},
    view: "oggi",
    conferma: null,           // {insId, tipo:'arrivo'|'inizio'|'fine'|'senza'}
    cerca: "",
    gestioneSbloccata: false,
    setupAperto: false,
    attesiAperti: "",
    pres: {}, presElenco: { gruppi: [], atlete: {} },
    gruppoSel: "", vistaPres: "oggi", periodoPres: "settimana", ancoraPres: "",
    formAtleta: null,
    periodo: "settimana",     // registro pubblico: giorno | settimana
    periodoG: "mese",         // gestione: mese | anno
    ancora: todayKey(),
    ancoraG: todayKey()
  };

  // ------------------------------------------------------------ modello
  function turniDi(k, insId) {
    var g = S.giorni[k];
    if (!g || !g.turni || !g.turni[insId] || !g.turni[insId].lista) return [];
    return g.turni[insId].lista.slice();
  }
  function chiusuraMin() { var m = toMin(S.config.oraChiusura); return m == null ? 22 * 60 : m; }
  function giornoRiaperto(k) {
    var g = S.giorni[k];
    return !!(g && g.riaperturaFino && new Date(g.riaperturaFino).getTime() > Date.now());
  }

  }

  function turnoAperto(lista) { return lista.length && !lista[lista.length - 1].f ? lista[lista.length - 1] : null; }
  function turnoRotto(k, lista) { return !giornoAperto(k) && !!turnoAperto(lista); }
  function totGiorno(k, fn) {
    var s = 0;
    S.config.insegnanti.forEach(function (i) { s += somma(turniDi(k, i.id), fn); });
    return s;
  }
  function attesoDi(ins, k) {
    return ins.attesi && ins.attesi[String(dowOf(k))] ? ins.attesi[String(dowOf(k))] : null;
  }

  // ------------------------------------------------------------ scrittura
  function scriviTurni(k, insId, lista) {
    if (!S.db) return Promise.reject({ code: "unavailable" });

          .catch(function () { return {}; })
          .then(function () { return ref.get(); })
          .then(function (snap) {
            if (snap.exists) return ref.update({ turni: body });
            return ref.set({ data: k, creatoAlle: nowIso(), riaperturaFino: null, turni: body });
          });

      throw e;
    });
  }
  function salvaConfig(next) {
    S.config = next;
    if (!S.db) { render(); return Promise.resolve(); }
    return S.db.doc("config/setup").set(next).catch(function (e) {
      toast(e && e.code === "invalid_argument" ? "Non hai i permessi per cambiare le impostazioni." : "Non è stato possibile salvare.");
    });
  }
  function toast(msg, ok) {
    S.toast = msg; S.toastOk = !!ok; render();
    setTimeout(function () { if (S.toast === msg) { S.toast = ""; S.toastOk = false; render(); } }, 4600);
  }

  // ------------------------------------------------------------ render
  function render() {
    var app = document.getElementById("app");
    app.className = S.view === "oggi" ? "" : "wide";
    var o = "";
    if (S.toast) o += '<div class="banner banner-' + (S.toastOk ? "ok" : "warn") + '" style="margin-bottom:14px">' + h(S.toast) + "</div>";
    if (S.err) o += '<div class="banner banner-warn" style="margin-bottom:14px">' + h(S.err) + "</div>";
    o += S.view === "oggi" ? viewOggi() : S.view === "registro" ? viewRegistro() : S.view === "presenze" ? viewPresenze() : viewGestione();
    try { app.innerHTML = o; }
    catch (e) { while (app.firstChild) app.removeChild(app.firstChild); app.innerHTML = o; }
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", b.dataset.view === S.view ? "true" : "false");
    });
    var f = app.querySelector("[data-autofocus]"); if (f) f.focus();
  }

  // ---- OGGI ----
  function viewOggi() {
    var k = todayKey(), aperto = giornoAperto(k);
    var n = new Date(), manca = chiusuraMin() - (n.getHours() * 60 + n.getMinutes());
    var inPalestra = S.config.insegnanti.filter(function (i) { return turnoAperto(turniDi(k, i.id)); });
    var attive = S.config.insegnanti.filter(function (i) { return turniDi(k, i.id).length; });

    var o = '<div class="stack">';
    o += '<div class="card"><div class="dayhead">' +
      '<div><div class="eyebrow">Giornata</div><div class="d">' + h(longDate(k)) + "</div></div>" +
      '<div style="text-align:right">' +
      (aperto
        ? '<span class="pill pill-ok"><span class="dot"></span>Registro aperto</span><div class="small muted" style="margin-top:5px">Si chiude alle <span class="mono">' + h(S.config.oraChiusura) + "</span>" + (manca > 0 && manca < 720 ? " · fra <span class=\"mono\">" + fmtDur(manca) + "</span>" : "") + "</div>"
        : '<span class="pill pill-crit"><span class="dot"></span>Registro chiuso</span><div class="small muted" style="margin-top:5px">Oggi non si registra più</div>') +
      "</div></div><hr class=\"divider\">" +
      '<div class="row" style="padding:12px 18px; gap:22px">' +
      '<div><div class="eyebrow">Ore di lezione oggi</div><div class="mono" style="font-size:21px">' + fmtMin(totGiorno(k, nette)) + "</div></div>" +
      '<div><div class="eyebrow">Presenza in palestra</div><div class="mono" style="font-size:21px; color:var(--ink-2)">' + fmtMin(totGiorno(k, presenza)) + "</div></div>" +
      '<div><div class="eyebrow">In palestra ora</div><div class="mono" style="font-size:21px">' + inPalestra.length + "</div>" +
      (inPalestra.length ? '<div class="tiny muted">' + h(inPalestra.map(function (i) { return i.nome; }).join(", ")) + "</div>" : "") + "</div>" +
      '<div><div class="eyebrow">Hanno lavorato</div><div class="mono" style="font-size:21px">' + attive.length + "</div></div>" +
      "</div></div>";

    o += '<div class="card">' +
      '<div style="padding:13px 16px 10px"><div class="eyebrow">Elenco insegnanti</div>' +
      '<input class="inp" style="margin-top:8px" data-act="cerca" placeholder="Cerca il tuo nome" value="' + h(S.cerca) + '" autocomplete="off"></div><hr class="divider">';
    var filtro = S.cerca.trim().toLowerCase();
    var lista = S.config.insegnanti.filter(function (i) { return !filtro || i.nome.toLowerCase().indexOf(filtro) >= 0; });
    if (!lista.length) o += '<div class="empty">Nessun nome corrisponde alla ricerca.</div>';
    lista.forEach(function (i) { o += rigaInsegnante(k, i, aperto); });
    o += "</div>";

    o += '<p class="note" style="margin:0">Tre momenti da segnare: quando arrivi in palestra, quando comincia la lezione con le bambine e quando finisce. Le ore di lezione sono quelle che contano per i conteggi; l\'arrivo serve a vedere quanto tempo passa prima di iniziare. Ogni orario viene registrato nel momento in cui premi Invia, non si modifica e lo vedono tutte.</p>';
    o += "</div>";
    return o;
  }

  function rigaInsegnante(k, ins, aperto) {
    var lista = turniDi(k, ins.id), ap = turnoAperto(lista), rotto = turnoRotto(k, lista);
    var net = somma(lista, nette), pres = somma(lista, presenza);
    var conf = S.conferma && S.conferma.insId === ins.id ? S.conferma : null;
    var atteso = attesoDi(ins, k);

    var stato;
    if (rotto) stato = '<span class="pill pill-crit"><span class="dot"></span>Turno non chiuso</span>';
    else if (ap && ap.i) stato = '<span class="pill pill-live"><span class="dot"></span>Lezione dalle ' + h(ap.i) + "</span>";
    else if (ap) stato = '<span class="pill pill-live"><span class="dot"></span>In palestra dalle ' + h(ap.a) + "</span>";
    else if (lista.length) stato = '<span class="pill pill-ok"><span class="dot"></span>Concluso</span>';
    else stato = '<span class="pill pill-idle"><span class="dot"></span>Nessuna ora</span>';

    var o = '<div class="ins"><div class="ins-top"><div><div class="ins-name">' + h(ins.nome) + "</div>";
    if (lista.length) {
      o += '<div class="turni">' + lista.map(function (t) {
        var cls = !t.f ? (rotto ? " rotto" : " aperto") : "";
        var testo = (t.a ? h(t.a) + " · " : "") + (t.i ? h(t.i) + " → " + (t.f ? h(t.f) : "…") : "in attesa");
        return '<span class="turno' + cls + '">' + testo + "</span>";
      }).join("") + "</div>";
    }
    o += "</div>" +
      '<div class="ins-tot">' + fmtMin(net) + '<span class="sec">in palestra ' + fmtMin(pres) + "</span></div></div>";

    o += '<div class="row" style="margin-top:8px; justify-content:space-between">' + stato;
    if (aperto && !conf) {
      if (!ap) {
        o += '<span class="row" style="gap:6px">' +
          '<button class="btn btn-primary btn-sm" data-act="chiedi" data-ins="' + h(ins.id) + '" data-tipo="arrivo">Sono arrivata</button>' +
          '<button class="btn btn-sm" data-act="chiedi" data-ins="' + h(ins.id) + '" data-tipo="inizio">Inizio lezione</button></span>';
      } else if (!ap.i) {
        o += '<span class="row" style="gap:6px">' +
          '<button class="btn btn-primary btn-sm" data-act="chiedi" data-ins="' + h(ins.id) + '" data-tipo="inizio">Inizio lezione</button>' +
          '<button class="btn btn-xs btn-quiet" data-act="chiedi" data-ins="' + h(ins.id) + '" data-tipo="senza">Chiudi senza lezione</button></span>';
      } else {
        o += '<button class="btn btn-primary btn-sm" data-act="chiedi" data-ins="' + h(ins.id) + '" data-tipo="fine">Fine lezione</button>';
      }
    }
    o += "</div>";

    if (conf) {
      var etichette = { arrivo: "Arrivo in palestra di ", inizio: "Inizio della lezione di ", fine: "Fine della lezione di ", senza: "Chiusura senza lezione di " };
      var d = new Date(), rit = null;
      if (conf.tipo === "arrivo" && atteso) {
        var diff = (d.getHours() * 60 + d.getMinutes()) - toMin(atteso);
        if (diff > (S.config.tolleranzaRitardo || 0)) rit = diff;
      }
      o += '<div class="confirm fade">' +
        '<div class="eyebrow">' + h(etichette[conf.tipo]) + h(ins.nome) + "</div>" +
        '<div class="bigtime" style="margin:6px 0 2px">' + hhmm(d) + "</div>" +
        '<div class="tiny muted">' + h(longDate(k)) + ". Premendo Invia registri questo orario. Non sarà più modificabile.</div>" +
        (rit ? '<div class="small" style="margin-top:8px; color:var(--warn)">Orario atteso ' + h(atteso) + ": sono " + fmtDur(rit) + " di ritardo.</div>" : "") +
        '<div class="row" style="margin-top:12px"><button class="btn btn-primary" data-act="invia">Invia</button>' +
        '<button class="btn btn-quiet" data-act="annulla">Annulla</button></div></div>';
    }
    o += "</div>";
    return o;
  }

  // ---- periodi ----
  function rangeDi(periodo, ancora) {
    var d = dateOf(ancora);
    if (periodo === "giorno") return { from: ancora, to: ancora };
    if (periodo === "settimana") { var f = addDays(ancora, -(dowOf(ancora) - 1)); return { from: f, to: addDays(f, 6) }; }
    if (periodo === "mese") return { from: keyOf(new Date(d.getFullYear(), d.getMonth(), 1)), to: keyOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
    return { from: d.getFullYear() + "-01-01", to: d.getFullYear() + "-12-31" };
  }
  function labelDi(periodo, ancora) {
    var r = rangeDi(periodo, ancora), d = dateOf(r.from);
    if (periodo === "giorno") return longDate(r.from);
    if (periodo === "settimana") return shortDate(r.from) + " – " + shortDate(r.to);
    if (periodo === "mese") return MESI[d.getMonth()].charAt(0).toUpperCase() + MESI[d.getMonth()].slice(1) + " " + d.getFullYear();
    return "Anno " + d.getFullYear();
  }
  function sposta(periodo, ancora, n) {
    var d = dateOf(ancora);
    if (periodo === "giorno") return addDays(ancora, n);
    if (periodo === "settimana") return addDays(ancora, 7 * n);
    if (periodo === "mese") return keyOf(new Date(d.getFullYear(), d.getMonth() + n, 1));
    return keyOf(new Date(d.getFullYear() + n, 0, 1));
  }
  function giorniDi(periodo, ancora) {
    var r = rangeDi(periodo, ancora), t = todayKey(), fine = r.to > t ? t : r.to, out = [], k = r.from;
    while (k <= fine) { out.push(k); k = addDays(k, 1); }
    return out;
  }
  function barraPeriodo(opzioni, periodo, prefix) {
    return '<div class="card" style="padding:12px 15px"><div class="row" style="justify-content:space-between">' +
      '<div class="seg">' + opzioni.map(function (p) {
        return '<button data-act="' + prefix + 'periodo" data-v="' + p + '" aria-pressed="' + (periodo === p) + '">' + p.charAt(0).toUpperCase() + p.slice(1) + "</button>";
      }).join("") + "</div>" +
      '<div class="row"><button class="btn btn-sm" data-act="' + prefix + 'prev" aria-label="Precedente">←</button>' +
      '<b style="min-width:170px; text-align:center">' + h(labelDi(periodo, prefix === "g" ? S.ancoraG : S.ancora)) + "</b>" +
      '<button class="btn btn-sm" data-act="' + prefix + 'next" aria-label="Successivo">→</button>' +
      '<button class="btn btn-sm btn-quiet" data-act="' + prefix + 'oggi">Oggi</button></div></div></div>';
  }

  function aggrega(periodo, ancora) {
    var per = {}, totN = 0, totP = 0, incompleti = 0, giorniAttivi = 0;
    S.config.insegnanti.forEach(function (i) {
      per[i.id] = { id: i.id, nome: i.nome, nette: 0, presenza: 0, giorni: 0, turni: 0, incompleti: 0, ritardi: 0, ritardoTot: 0, conAtteso: 0, arriviTot: 0, arrivi: 0 };
    });
    giorniDi(periodo, ancora).forEach(function (k) {
      var attivo = false;
      S.config.insegnanti.forEach(function (ins) {
        var l = turniDi(k, ins.id);
        if (!l.length) return;
        attivo = true;
        var p = per[ins.id], n = somma(l, nette), pr = somma(l, presenza);
        p.nette += n; p.presenza += pr; p.turni += l.length;
        if (n > 0) p.giorni += 1;
        totN += n; totP += pr;
        if (turnoRotto(k, l)) { p.incompleti += 1; incompleti += 1; }
        var primo = l[0], oraArrivo = primo.a || primo.i;
        if (oraArrivo) { p.arriviTot += toMin(oraArrivo); p.arrivi += 1; }
        var atteso = attesoDi(ins, k);
        if (atteso && oraArrivo) {
          p.conAtteso += 1;
          var diff = toMin(oraArrivo) - toMin(atteso);
          if (diff > (S.config.tolleranzaRitardo || 0)) { p.ritardi += 1; p.ritardoTot += diff; }
        }
      });
      if (attivo) giorniAttivi += 1;
    });
    return { per: per, totN: totN, totP: totP, incompleti: incompleti, giorniAttivi: giorniAttivi };
  }

  function tile(k, v, n, alert) {
    return '<div class="tile' + (alert ? " alert" : "") + '"><div class="k">' + h(k) + '</div><div class="v">' + h(v) + '</div><div class="n">' + h(n) + "</div></div>";
  }

  function grafico(righe) {
    if (!righe.length) return '<div class="empty">Nessuna ora registrata in questo periodo.</div>';
    var max = righe.reduce(function (m, x) { return Math.max(m, x.presenza, x.nette); }, 0) || 1;
    var o = '<div class="legend"><span><i style="background:var(--data)"></i>Ore di lezione</span>' +
      '<span><i style="background:var(--data-weak)"></i>Tempo in palestra</span></div><div class="chart">';
    righe.forEach(function (x) {
      o += '<div class="crow"><div class="cname">' + h(x.nome) + "</div>" +
        '<div class="ctrack"><div class="cpres" style="width:' + Math.round((x.presenza / max) * 100) + '%"></div>' +
        '<div class="cnet" style="width:' + Math.round((x.nette / max) * 100) + '%"></div></div>' +
        '<div class="cval">' + fmtOre(x.nette) + "</div></div>";
    });
    o += "</div>";
    return o;
  }

  // ---- REGISTRO (aperto a tutte) ----
  function viewRegistro() {
    var A = aggrega(S.periodo, S.ancora);
    var righe = Object.keys(A.per).map(function (id) { return A.per[id]; })
      .filter(function (x) { return x.nette || x.presenza || x.turni; })
      .sort(function (a, b) { return b.nette - a.nette; });

    var o = '<div class="stack">';
    o += barraPeriodo(["giorno", "settimana"], S.periodo, "");
    o += '<div class="tiles">' +
      tile("Ore di lezione", fmtOre(A.totN), "nel periodo", false) +
      tile("Tempo in palestra", fmtOre(A.totP), "arrivo compreso", false) +
      tile("Insegnanti attive", String(righe.length), "su " + S.config.insegnanti.length + " in elenco", false) +
      tile("Turni non chiusi", String(A.incompleti), "senza fine lezione", A.incompleti > 0) +
      "</div>";

    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">' + h(labelDi(S.periodo, S.ancora)) + "</div>" +
      '<h2 class="sec-title">Ore di ciascuna</h2>' +
      '<p class="small muted" style="margin:3px 0 6px">La barra scura sono le ore di lezione con le bambine, quella chiara il tempo passato in palestra dall\'arrivo alla fine.</p></div>' +
      grafico(righe) + "</div>";

    var body = "";
    giorniDi(S.periodo, S.ancora).slice().reverse().forEach(function (k) {
      var attive = S.config.insegnanti.filter(function (i) { return turniDi(k, i.id).length; });
      if (!attive.length) return;
      var tn = totGiorno(k, nette), rotti = attive.filter(function (i) { return turnoRotto(k, turniDi(k, i.id)); }).length;
      body += '<details class="day"' + (k === todayKey() ? " open" : "") + '><summary><span class="daydate">' + h(longDate(k)) + "</span>" +
        '<span class="row" style="gap:8px">' +
        (rotti ? '<span class="pill pill-crit"><span class="dot"></span>' + rotti + " non chiuso" + (rotti > 1 ? "i" : "") + "</span>" : "") +
        '<span class="muted small">' + attive.length + (attive.length === 1 ? " insegnante" : " insegnanti") + '</span><b class="mono">' + fmtMin(tn) + "</b></span></summary>" +
        '<div class="tablewrap"><table><thead><tr><th>Insegnante</th><th>Arrivo</th><th>Lezione</th><th class="num">Ore lezione</th><th class="num">In palestra</th></tr></thead><tbody>';
      attive.forEach(function (i) {
        var l = turniDi(k, i.id);
        body += "<tr><td>" + h(i.nome) + "</td>" +
          '<td class="mono muted">' + l.map(function (t) { return t.a ? h(t.a) : "—"; }).join(" / ") + "</td>" +
          "<td>" + l.map(function (t) { return '<span class="turno' + (!t.f ? " rotto" : "") + '">' + (t.i ? h(t.i) : "—") + " → " + (t.f ? h(t.f) : "—") + "</span>"; }).join(" ") + "</td>" +
          '<td class="num">' + fmtOre(somma(l, nette)) + "</td>" +
          '<td class="num muted">' + fmtOre(somma(l, presenza)) + "</td></tr>";
      });
      body += '</tbody><tfoot><tr><td>Totale del giorno</td><td></td><td></td><td class="num">' + fmtOre(tn) + '</td><td class="num">' + fmtOre(totGiorno(k, presenza)) + "</td></tr></tfoot></table></div></details>";
    });
    o += '<div class="card">' + (body || '<div class="empty">Nessuna giornata con ore registrate in questo periodo.</div>') + "</div>";
    o += '<p class="note" style="margin:0">Qui si vedono il giorno e la settimana. I riepiloghi del mese e dell\'anno sono nella parte riservata a chi gestisce.</p>';
    o += "</div>";
    return o;
  }


  // ------------------------------------------------------------ PRESENZE
  function gate(titolo, testo, azione) {
    return '<div class="card" style="max-width:410px; margin:36px auto; padding:24px">' +
      '<div class="eyebrow">Solo per chi gestisce</div>' +
      '<h2 class="sec-title" style="margin:4px 0 6px">' + h(titolo) + "</h2>" +
      '<p class="small muted" style="margin-top:0">' + h(testo) + "</p>" +
      '<p class="small muted">Questa parte è riservata a chi si occupa dell\'amministrazione. Il tuo accesso funziona, ma non apre questa scheda.</p></div>';
  }

  var CORSI_ZODIACO = [
    "Inizio al movimento", "I corso", "II corso", "III corso", "RANDI",
    "AVANZATO PICCOLE", "AVANZATO MEDIE", "AVANZATO GRANDI",
    "SILVER MINI", "SILVER ALLIEVE", "SILVER OPEN", "SILVER UISP JUNIOR-SENIOR", "SILVER FGI JUNIOR-SENIOR",
    "GOLD MINI", "GOLD ALLIEVE", "GOLD CATEGORIA",
    "MODERN I", "MODERN II", "CONTEMPORANEO", "HIP-HOP MONOSETTIMANALE", "HIP-HOP BISETTIMANALE"
  ];
  function gruppi() { return (S.presElenco.gruppi || []).slice(); }
  function atleteTutte() { return S.presElenco.atlete || {}; }
  function gruppoAttivo() {
    var g = gruppi();
    if (S.gruppoSel && g.filter(function (x) { return x.id === S.gruppoSel; }).length) return S.gruppoSel;
    return g.length ? g[0].id : "";
  }
  function nomeGruppo(id) {
    var g = gruppi().filter(function (x) { return x.id === id; })[0];
    return g ? g.nome : "—";
  }
  function atleteDi(gid) {
    var a = atleteTutte();
    return Object.keys(a).filter(function (id) { return a[id].gruppoId === gid; })
      .sort(function (x, y) { return String(a[x].nome).localeCompare(String(a[y].nome)); });
  }
  function segniDi(k) { return (S.pres[k] && S.pres[k].righe) || {}; }
  function segnoDi(k, id) { var r = segniDi(k)[id]; return r ? r.s : ""; }

  function scriviPresenze(k, mappa) {
    if (!S.db) return Promise.reject({ code: "unavailable" });
    var ref = S.db.doc("presenze/g-" + k);
    return ref.update({ righe: mappa }).catch(function (e) {
      if (e && (e.code === "invalid_argument" || e.code === "transform_error")) {
        return ref.acquire({ holder: "p" + Math.random().toString(36).slice(2), ttlMs: 4000 })
          .catch(function () { return {}; })
          .then(function () { return ref.get(); })
          .then(function (snap) {
            if (snap.exists) return ref.update({ righe: mappa });
            return ref.set({ data: k, creatoAlle: nowIso(), righe: mappa });
          });
      }
      throw e;
    });
  }
  function scriviElenco(next) {
    S.presElenco = next;
    if (!S.db) { render(); return Promise.resolve(); }
    return S.db.doc("presenze/elenco").set(next).catch(function () { toast("Non è stato possibile salvare l'elenco."); });
  }

  function viewPresenze() {
    var k = todayKey(), aperto = giornoAperto(k), gid = gruppoAttivo();
    var o = '<div class="stack">';

    if (!gruppi().length) {
      o += '<div class="card"><div class="empty">Non ci sono ancora gruppi. Chi gestisce l\'associazione può crearli dalla scheda Gestione, insieme all\'elenco delle atlete.</div></div>';
      return o + "</div>";
    }

    o += '<div class="card" style="padding:12px 15px"><div class="row" style="justify-content:space-between">' +
      '<div class="row"><span class="eyebrow">Gruppo</span><select class="inp" style="max-width:190px" data-act="gruppo">' +
      gruppi().map(function (g) { return '<option value="' + h(g.id) + '"' + (g.id === gid ? " selected" : "") + ">" + h(g.nome) + "</option>"; }).join("") +
      "</select></div>" +
      '<div class="seg">' +
      [["oggi", "Oggi"], ["andamento", "Andamento"]].map(function (v) {
        return '<button data-act="vistaPres" data-v="' + v[0] + '" aria-pressed="' + (S.vistaPres === v[0]) + '">' + v[1] + "</button>";
      }).join("") + "</div></div></div>";

    o += S.vistaPres === "oggi" ? presOggi(k, gid, aperto) : presAndamento(gid);
    o += "</div>";
    return o;
  }

  function presOggi(k, gid, aperto) {
    var ids = atleteDi(gid), a = atleteTutte();
    var P = 0, A = 0;
    ids.forEach(function (id) { var sg = segnoDi(k, id); if (sg === "P") P += 1; else if (sg === "A") A += 1; });
    var mancanti = ids.length - P - A;

    var o = '<div class="card"><div class="dayhead">' +
      '<div><div class="eyebrow">' + h(nomeGruppo(gid)) + '</div><div class="d">' + h(longDate(k)) + "</div></div>" +
      '<div style="text-align:right">' +

              '<button class="btn btn-sm' + (sg === "A" ? " btn-primary" : "") + '" data-act="segna" data-id="' + h(id) + '" data-s="A">Assente</button>'
            : sg === "P" ? '<span class="pill pill-ok"><span class="dot"></span>Presente</span>'
              : sg === "A" ? '<span class="pill pill-crit"><span class="dot"></span>Assente</span>'

    return o;
  }

  function giorniPres(periodo, ancora) {
    var r = rangeDi(periodo, ancora), t = todayKey(), fine = r.to > t ? t : r.to, out = [], k = r.from;
    while (k <= fine) { out.push(k); k = addDays(k, 1); }
    return out;
  }

  function presAndamento(gid) {
    if (!S.ancoraPres) S.ancoraPres = todayKey();
    var ids = atleteDi(gid), a = atleteTutte(), gg = giorniPres(S.periodoPres, S.ancoraPres);
    var giorniGruppo = 0;
    gg.forEach(function (k) {
      var seg = segniDi(k), c = 0;
      ids.forEach(function (id) { if (seg[id]) c += 1; });
      if (c) giorniGruppo += 1;
    });
    var righe = ids.map(function (id) {
      var p = 0, as = 0;
      gg.forEach(function (k) { var sg = segnoDi(k, id); if (sg === "P") p += 1; else if (sg === "A") as += 1; });
      var tot = p + as;
      return { id: id, nome: a[id].nome, p: p, a: as, tot: tot, tasso: tot ? p / tot : null, nonSegnati: giorniGruppo - tot };
    });
    righe.sort(function (x, y) {
      if (x.tasso == null) return 1;
      if (y.tasso == null) return -1;
      return x.tasso - y.tasso;
    });

    var o = '<div class="card" style="padding:12px 15px"><div class="row" style="justify-content:space-between">' +
      '<div class="seg">' + ["settimana", "mese"].map(function (pp) {
        return '<button data-act="pperiodo" data-v="' + pp + '" aria-pressed="' + (S.periodoPres === pp) + '">' + pp.charAt(0).toUpperCase() + pp.slice(1) + "</button>";
      }).join("") + "</div>" +
      '<div class="row"><button class="btn btn-sm" data-act="pprev" aria-label="Precedente">←</button>' +
      '<b style="min-width:170px; text-align:center">' + h(labelDi(S.periodoPres, S.ancoraPres)) + "</b>" +
      '<button class="btn btn-sm" data-act="pnext" aria-label="Successivo">→</button>' +
      '<button class="btn btn-sm btn-quiet" data-act="poggi">Oggi</button></div></div></div>';

    o += '<div class="card"><div style="padding:14px 16px 2px"><div class="eyebrow">' + h(nomeGruppo(gid)) + "</div>" +
      '<h2 class="sec-title">Chi c\'è stato e chi no</h2>' +
      '<p class="small muted" style="margin:3px 0 8px">Ordinate dalla frequenza più bassa: le prime righe sono quelle a cui vale la pena fare una telefonata. Allenamenti segnati nel periodo: <b>' + giorniGruppo + "</b>.</p></div>";
    if (!righe.length || !giorniGruppo) {
      o += '<div class="empty">Nessuna presenza segnata in questo periodo.</div></div>';
      return o;
    }
    o += '<div class="tablewrap"><table><thead><tr><th>Atleta</th><th class="num">Presenze</th><th class="num">Assenze</th><th></th><th class="num">Frequenza</th><th class="num">Non segnati</th></tr></thead><tbody>';
    righe.forEach(function (x) {
      var col = x.tasso == null ? "var(--ink-2)" : (x.tasso < 0.5 ? "var(--crit)" : x.tasso < 0.75 ? "var(--warn)" : "var(--ok)");
      o += "<tr><td><b>" + h(x.nome) + "</b></td>" +
        '<td class="num">' + x.p + "</td>" +
        '<td class="num muted">' + x.a + "</td>" +
        '<td><div class="barbg"><div class="bar" style="width:' + Math.round((x.tasso == null ? 0 : x.tasso) * 100) + '%; background:' + col + '"></div></div></td>' +
        '<td class="num" style="color:' + col + '"><b>' + (x.tasso == null ? '<span class="muted">—</span>' : Math.round(x.tasso * 100) + "%") + "</b></td>" +
        '<td class="num muted">' + (x.nonSegnati > 0 ? x.nonSegnati : "0") + "</td></tr>";
    });
    o += "</tbody></table></div></div>";
    return o;
  }

  function csvPresenze() {
    var out = [["Data", "Giorno", "Gruppo", "Atleta", "Stato", "Segnata alle"]];
    var gg = giorniPres(S.periodoG, S.ancoraG), a = atleteTutte();
    gg.forEach(function (k) {
      var seg = segniDi(k);
      Object.keys(seg).forEach(function (id) {
        if (!a[id]) return;
        out.push([k, GIORNI[dowOf(k)], nomeGruppo(a[id].gruppoId), a[id].nome,

    });
    return out.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";");
    }).join("\r\n");
  }

  function csvPeriodo() {
    var out = [["Data", "Giorno", "Insegnante", "Arrivo", "Inizio lezione", "Fine lezione", "Ore lezione", "Ore in palestra", "Orario atteso", "Ritardo minuti", "Stato"]];
    giorniDi(S.periodoG, S.ancoraG).forEach(function (k) {
      S.config.insegnanti.forEach(function (ins) {
        var l = turniDi(k, ins.id), atteso = attesoDi(ins, k);
        l.forEach(function (t, idx) {
          var arr = t.a || t.i, rit = "";
          if (atteso && arr && idx === 0) rit = String(toMin(arr) - toMin(atteso));
          out.push([k, GIORNI[dowOf(k)], ins.nome, t.a || "", t.i || "", t.f || "",
            fmtOre(nette(t)), fmtOre(presenza(t)), (idx === 0 && atteso) ? atteso : "", rit,
            t.f ? "completo" : (giornoAperto(k) ? "in corso" : "non chiuso")]);
        });
      });
    });
    return out.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(";");
    }).join("\r\n");
  }

  // ------------------------------------------------------------ eventi
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act], .tab");
    if (!t) return;
    if (t.classList.contains("tab")) { S.view = t.dataset.view; S.conferma = null; render(); return; }
    var act = t.dataset.act, v = t.dataset.v, k = todayKey();

    if (act === "chiedi") { S.conferma = { insId: t.dataset.ins, tipo: t.dataset.tipo }; render(); return; }
    if (act === "annulla") { S.conferma = null; render(); return; }

    if (act === "invia") {
      var c = S.conferma; if (!c) return;
      if (!giornoAperto(k)) { S.conferma = null; toast("Il registro di oggi è chiuso."); return; }
      var lista = turniDi(k, c.insId), ora = hhmm(new Date()), ap = turnoAperto(lista), msg = "";
      if (c.tipo === "arrivo") {
        if (ap) { S.conferma = null; toast("C'è già un turno aperto."); return; }
        lista.push({ a: ora, aIso: nowIso() });
        msg = "Arrivo registrato alle " + ora + ".";
      } else if (c.tipo === "inizio") {
        if (ap && ap.i) { S.conferma = null; toast("La lezione è già iniziata."); return; }
        if (ap) { ap.i = ora; ap.iIso = nowIso(); }
        else lista.push({ a: null, i: ora, iIso: nowIso() });
        msg = "Inizio lezione registrato alle " + ora + ".";
      } else if (c.tipo === "senza") {
        if (!ap) { S.conferma = null; toast("Non c'è nessun turno aperto."); return; }
        ap.i = ora; ap.iIso = nowIso(); ap.f = ora; ap.fIso = nowIso(); ap.senzaLezione = true;
        msg = "Turno chiuso senza ore di lezione.";
      } else {
        if (!ap || !ap.i) { S.conferma = null; toast("Non c'è nessuna lezione in corso."); return; }
        if (toMin(ora) <= toMin(ap.i)) { toast("La fine deve essere successiva all'inizio: aspetta il minuto successivo."); return; }
        ap.f = ora; ap.fIso = nowIso();
        msg = "Fine lezione registrata alle " + ora + ".";
      }
      S.conferma = null;
      scriviTurni(k, c.insId, lista).then(function () { toast(msg, true); })
        .catch(function (e) { toast(e && e.code === "invalid_argument" ? "Non hai i permessi per scrivere nel registro." : "Non è stato possibile registrare. Riprova."); });
      return;
    }

    if (act === "gruppo" || act === "cerca") return;
    if (act === "vistaPres") { S.vistaPres = v; render(); return; }
    if (act === "pperiodo") { S.periodoPres = v; render(); return; }
    if (act === "pprev") { S.ancoraPres = sposta(S.periodoPres, S.ancoraPres || todayKey(), -1); render(); return; }
    if (act === "pnext") { S.ancoraPres = sposta(S.periodoPres, S.ancoraPres || todayKey(), 1); render(); return; }
    if (act === "poggi") { S.ancoraPres = todayKey(); render(); return; }

    if (act === "segna") {
      if (!giornoAperto(k)) { toast("La giornata è chiusa."); return; }
      var idS = t.dataset.id, val = t.dataset.s, mS = {};
      if (segnoDi(k, idS) === val) return;
      mS[idS] = { s: val, ora: hhmm(new Date()), quando: nowIso() };
      scriviPresenze(k, mS).catch(function () { toast("Non è stato possibile salvare la presenza."); });
      return;
    }
    if (act === "tuttePresenti") {
      if (!giornoAperto(k)) { toast("La giornata è chiusa."); return; }
      var idsT = atleteDi(gruppoAttivo()), mT = {}, nT = 0;
      idsT.forEach(function (id) {
        if (segnoDi(k, id)) return;
        mT[id] = { s: "P", ora: hhmm(new Date()), quando: nowIso() }; nT += 1;
      });
      if (!nT) { toast("Sono già segnate tutte."); return; }
      scriviPresenze(k, mT).then(function () { toast(nT + (nT === 1 ? " atleta segnata presente." : " atlete segnate presenti."), true); })
        .catch(function () { toast("Non è stato possibile salvare."); });
      return;
    }

    if (act === "gruppiZodiaco") {
      var nz = JSON.parse(JSON.stringify(S.presElenco));
      nz.gruppi = nz.gruppi || [];
      var esistenti = {};
      nz.gruppi.forEach(function (g) { esistenti[g.nome] = true; });
      var aggiunti = 0;
      CORSI_ZODIACO.forEach(function (nome, i) {
        if (esistenti[nome]) return;
        nz.gruppi.push({ id: "gz" + i + Date.now().toString(36), nome: nome });
        aggiunti += 1;
      });
      scriviElenco(nz).then(function () { toast(aggiunti + " gruppi creati.", true); });
      return;
    }
    if (act === "addGruppo") {
      var ng = JSON.parse(JSON.stringify(S.presElenco));
      ng.gruppi = ng.gruppi || [];
      ng.gruppi.push({ id: "g" + Date.now().toString(36), nome: "Nuovo gruppo" });
      scriviElenco(ng); return;
    }
    if (act === "delGruppo") {
      var ng2 = JSON.parse(JSON.stringify(S.presElenco));
      if (Object.keys(ng2.atlete || {}).filter(function (id) { return ng2.atlete[id].gruppoId === v; }).length) {
        toast("Ci sono ancora atlete in questo gruppo: spostale prima."); return;
      }
      ng2.gruppi = (ng2.gruppi || []).filter(function (g) { return g.id !== v; });
      scriviElenco(ng2); return;
    }
    if (act === "nuovaAtleta") { S.formAtleta = { gruppoId: gruppoAttivo() || (gruppi()[0] || {}).id || "" }; render(); return; }
    if (act === "chiudiForm") { S.formAtleta = null; render(); return; }
    if (act === "salvaAtleta") {
      var nomeA = ((document.getElementById("f-atlnome") || {}).value || "").trim();
      var gidA = (document.getElementById("f-atlgruppo") || {}).value || "";
      if (!nomeA) { toast("Serve il nome."); return; }
      if (!gidA) { toast("Serve un gruppo."); return; }
      var ne = JSON.parse(JSON.stringify(S.presElenco));
      ne.atlete = ne.atlete || {};
      var idA = (S.formAtleta && S.formAtleta.id) || "at" + Date.now().toString(36) + Math.floor(Math.random() * 900 + 100);
      ne.atlete[idA] = { nome: nomeA, gruppoId: gidA };
      S.formAtleta = null;
      scriviElenco(ne).then(function () { toast("Elenco aggiornato.", true); });
      return;
    }
    if (act === "modAtleta") {
      var aM = atleteTutte()[v] || {};
      S.formAtleta = { id: v, nome: aM.nome, gruppoId: aM.gruppoId }; render(); return;
    }
    if (act === "delAtleta") {
      var nd = JSON.parse(JSON.stringify(S.presElenco));
      delete nd.atlete[v];
      scriviElenco(nd); return;
    }
    if (act === "csvPresenze") {
      if (!S.downloads) { toast("Il download non è disponibile in questa vista."); return; }
      var rr3 = rangeDi(S.periodoG, S.ancoraG);
      S.downloads.save({ filename: "presenze-" + rr3.from + "_" + rr3.to + ".csv", data: "﻿" + csvPresenze() })
        .catch(function (e) { if (e && e.code !== "declined") toast("Non è stato possibile creare il file."); });
      return;
    }

    if (act === "periodo") { S.periodo = v; render(); return; }
    if (act === "prev") { S.ancora = sposta(S.periodo, S.ancora, -1); render(); return; }
    if (act === "next") { S.ancora = sposta(S.periodo, S.ancora, 1); render(); return; }
    if (act === "oggi") { S.ancora = todayKey(); render(); return; }
    if (act === "gperiodo") { S.periodoG = v; render(); return; }
    if (act === "gprev") { S.ancoraG = sposta(S.periodoG, S.ancoraG, -1); render(); return; }
    if (act === "gnext") { S.ancoraG = sposta(S.periodoG, S.ancoraG, 1); render(); return; }
    if (act === "goggi") { S.ancoraG = todayKey(); render(); return; }

    if (act === "pin") {
      var p = document.getElementById("f-pin");
      if (p && p.value === String(S.config.pinGestione)) { S.gestioneSbloccata = true; render(); }
      else toast("Codice non corretto.");
      return;
    }
    if (act === "setup") { S.setupAperto = !S.setupAperto; render(); return; }
    if (act === "attesi") { leggiSetup(); S.attesiAperti = S.attesiAperti === v ? "" : v; render(); return; }
    if (act === "addIns") { leggiSetup(); S.config.insegnanti.push({ id: "p" + Date.now().toString(36), nome: "Nuova insegnante", attesi: {} }); render(); return; }
    if (act === "delIns") { leggiSetup(); S.config.insegnanti = S.config.insegnanti.filter(function (i) { return i.id !== v; }); render(); return; }
    if (act === "salvaSetup") {
      leggiSetup();
      var ch = document.getElementById("f-chiusura"), pn = document.getElementById("f-pinnew"), tl = document.getElementById("f-toll");
      if (ch && toMin(ch.value) == null) { toast("L'ora di chiusura va scritta come 22:00."); return; }
      if (ch) S.config.oraChiusura = ch.value.trim();
      if (pn && pn.value.trim()) S.config.pinGestione = pn.value.trim();
      if (tl && !isNaN(+tl.value)) S.config.tolleranzaRitardo = Math.max(0, Math.round(+tl.value));
      salvaConfig(S.config).then(function () { toast("Impostazioni salvate.", true); });
      return;
    }
    if (act === "riapri") {
      var rd = document.getElementById("f-riap"), dk = rd ? rd.value.trim() : "";
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) { toast("Scrivi la data come " + todayKey() + "."); return; }
      if (!S.db) { toast("Registro non disponibile."); return; }
      var fino = new Date(Date.now() + 3600000).toISOString(), ref = S.db.doc("giorni/" + dk);
      ref.update({ riaperturaFino: fino, ultimaRiapertura: nowIso() })
        .catch(function () { return ref.set({ data: dk, creatoAlle: nowIso(), riaperturaFino: fino, ultimaRiapertura: nowIso(), turni: {} }); })
        .then(function () { toast("Giornata del " + dk + " riaperta per un'ora.", true); })
        .catch(function () { toast("Non è stato possibile riaprire la giornata."); });
      return;
    }
    if (act === "csv") {
      if (!S.downloads) { toast("Il download non è disponibile in questa vista."); return; }
      var r = rangeDi(S.periodoG, S.ancoraG);
      S.downloads.save({ filename: "ore-" + r.from + "_" + r.to + ".csv", data: "﻿" + csvPeriodo() })
        .catch(function (e) { if (e && e.code !== "declined") toast("Non è stato possibile creare il file."); });
      return;
    }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t.dataset) return;
    if (t.dataset.act === "gruppo") { S.gruppoSel = t.value; render(); return; }
    if (t.dataset.grnome) {
      var ng = JSON.parse(JSON.stringify(S.presElenco));
      ng.gruppi.forEach(function (g) { if (g.id === t.dataset.grnome && t.value.trim()) g.nome = t.value.trim(); });
      scriviElenco(ng); return;
    }
    if (t.dataset.atlgruppo) {
      var na = JSON.parse(JSON.stringify(S.presElenco));
      if (na.atlete[t.dataset.atlgruppo]) na.atlete[t.dataset.atlgruppo].gruppoId = t.value;
      scriviElenco(na); return;
    }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.dataset && ev.target.dataset.act === "cerca") {
      S.cerca = ev.target.value;
      var pos = ev.target.selectionStart;
      render();
      var n = document.querySelector('[data-act="cerca"]');
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }
  });

  function leggiSetup() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-ins]"), function (e) {
      S.config.insegnanti.forEach(function (i) { if (i.id === e.dataset.ins && e.value.trim()) i.nome = e.value.trim(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-atteso]"), function (e) {
      S.config.insegnanti.forEach(function (i) {
        if (i.id !== e.dataset.atteso) return;
        if (!i.attesi) i.attesi = {};
        var val = e.value.trim();
        if (!val) delete i.attesi[e.dataset.g];
        else if (toMin(val) != null) i.attesi[e.dataset.g] = val;
      });
    });
  }

  // ------------------------------------------------------------ avvio
  function attach() {
    S.db.doc("config/setup").onSnapshot(function (snap) {
      if (snap.exists) {
        var d = snap.data();
        if (d && d.insegnanti && d.insegnanti.length) {
          if (d.tolleranzaRitardo == null) d.tolleranzaRitardo = 5;
          S.config = d;
        }
      }
      render();
    }, function () {});
    S.db.collection("presenze").limit(400).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var b = d.data() || {};
        if (d.id === "elenco") S.presElenco = { gruppi: b.gruppi || [], atlete: b.atlete || {} };
        else if (d.id.indexOf("g-") === 0) m[d.id.slice(2)] = { righe: b.righe || {} };
      });
      S.pres = m;
      render();
    }, function () {});

    S.db.collection("giorni").orderBy("data", "desc").limit(400).onSnapshot(function (snap) {
      var m = {};
      snap.docs.forEach(function (d) {
        var b = d.data() || {};
        m[d.id] = { data: d.id, turni: b.turni || {}, riaperturaFino: b.riaperturaFino || null };
      });
      S.giorni = m;
      render();
    }, function () { S.err = "Il registro non si sta aggiornando in tempo reale. Ricarica la pagina."; render(); });
  }

  function boot() {
    window.ZODIACO_PRONTO = function () {
      S.gestioneSbloccata = !!(window.ZODIACO && window.ZODIACO.gestione);
      render();
    };
    render();
    if (!(window.claude && typeof window.claude.use === "function")) {
      S.err = "Questa anteprima non è collegata al registro condiviso: gli orari non vengono salvati.";
      render(); return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) { S.err = "Registro condiviso non disponibile in questa vista: puoi guardare, non registrare."; render(); return; }
      S.db = db; attach();
    }).catch(function () { S.err = "Registro condiviso non raggiungibile."; render(); });
    window.claude.use("downloads").then(function (d) { S.downloads = d; }).catch(function () {});
    setInterval(function () {
      var a = document.activeElement;
      if (a && a.dataset && a.dataset.act === "cerca") return;
      if (S.view === "oggi") render();
    }, 30000);
  }

  boot();
})();
</script>

</body>
</html>
